<style>
  :root {
    --gray100: #F5F5F5;
    --gray300: #E0E0E0;
    --gray600: #666666;
    --blue: #245eff;

    --quickfilter-icon-size: 20px;
  }

  /* [데모 전용] 페이지 레이아웃: 리셋·제목·재생 방식 라디오·섹션 라벨·행 배경 */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; padding: 40px 24px;}
  h1 {font-size: 16px; font-weight: 600; color: #222; margin-bottom: 12px;}
  
  .download-button {display: inline-flex; align-items: center; height: 30px; padding: 0 12px; margin-bottom: 20px; border-radius: 4px; background-color: #000; font-size: 13px; font-weight: 500; color: #fff; text-decoration: none;}
  .download-button:hover {background-color: #333;}
  .play-mode {display: flex; flex-direction: column; gap: 10px; border: 0; margin-bottom: 32px;}
  .play-mode label {display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #222; cursor: pointer;}
  .play-mode input {accent-color: var(--blue); margin: 0; width: 13px; height: 13px;}
  .play-mode-rules {margin: 4px 0 0 19px; padding-left: 14px; font-size: 12px; line-height: 18px; color: #999;}
  .play-mode-option:has(input:checked) .play-mode-rules {color: var(--gray600);}
  .section-label {font-size: 11px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;}
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; background: var(--gray100); padding: 20px;}

  /* [적용] 로티 컨테이너 */
  .lottie-icon {display: block; width: 100%; height: 100%;}

  /* --------------------- FilterOutlinedItem ------------------------*/
  /* [적용 참고] 칩 컴포넌트 스타일. 서비스에 이미 있는 컴포넌트 스타일이 있으면 그쪽을 쓰고, 아이콘 영역(.icon 20×20)만 맞춘다 */
  .FilterOutlinedItem {
    display: inline-flex;
    align-items: center;
    height: 30px;
    padding-left: 6px;
    padding-right: 8px;
    gap: 0;
    border: 1px solid var(--gray300);
    border-radius: 4px;
    background-color: transparent;
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  .FilterOutlinedItem .icon { width: var(--quickfilter-icon-size); height: var(--quickfilter-icon-size); flex-shrink: 0; display: flex; align-items: center; justify-content: center;}
  .FilterOutlinedItem .label { font-size: 13px; font-weight: 400; line-height: 18px;color: var(--gray600);}
   /* Active 상태 */
  .FilterOutlinedItem.is-active {border-color: var(--blue); background-color: #245eff0d;}
  .FilterOutlinedItem.is-active .label {color: var(--blue); font-weight: 600;}


</style>

<!-- Lottie Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
<script>
  window.addEventListener('load', function() {

    // [적용] 아이콘 로드와 재생 제어 — 로티 로드, is-play / is-once 를 붙이고 떼서 SVG Inline·IMG 모션을 시작·정지한다 (playIcon / stopIcon)
    const ICONS = ['campaign', 'coupon', 'plusdelivery', 'special', 'timesale', 'star', 'exclusive', 'lowestprice'];
    const RANDOM_INTERVAL = 2800;
    // 배포 때 빌드 도구의 파일 해시로 바꾼다 (캐시 무효화)
    const ASSET_VERSION = '20261023';

    // 같은 SVG 가 한 페이지에 여러 번 들어가도 그라디언트·clipPath 참조가 섞이지 않도록 내부 id 를 아이콘마다 고유하게 바꾼다
    document.querySelectorAll('svg.ic-quickfilter').forEach(function(svg, index) {
      svg.querySelectorAll('[id]').forEach(function(node) {
        const oldId = node.id;
        const newId = oldId + '-' + index;
        node.id = newId;
        svg.querySelectorAll('*').forEach(function(el) {
          ['fill', 'stroke', 'clip-path', 'mask', 'href', 'xlink:href'].forEach(function(attr) {
            const value = el.getAttribute(attr);
            if (value && value.indexOf('#' + oldId) !== -1) {
              el.setAttribute(attr, value.split('#' + oldId + ')').join('#' + newId + ')').replace(new RegExp('^#' + oldId + '$'), '#' + newId));
            }
          });
        });
      });
    });

    // 같은 아이콘이 여러 개 있어도 전부 함께 재생한다 (id 대신 클래스로 찾는다)
    const lotties = {};
    const loaded = [];
    ICONS.forEach(function(name) {
      lotties[name] = [];
      document.querySelectorAll('.ic-quickfilter-lottie-' + name).forEach(function(container) {
        const anim = lottie.loadAnimation({
          container: container,
          path: './src/lottie/ic_quickfilter_' + name + '.json?v=' + ASSET_VERSION,
          renderer: 'svg',
          loop: false,
          autoplay: false
        });
        lotties[name].push(anim);
        loaded.push(new Promise(function(resolve) { anim.addEventListener('DOMLoaded', resolve); }));
      });
    });

    // SVG Inline(svg.ic-quickfilter-이름) 과 IMG(.ic-quickfilter-img-이름) 아이콘 전부
    const cssTargetsOf = function(name) {
      return document.querySelectorAll('svg.ic-quickfilter-' + name + ', .ic-quickfilter-img-' + name);
    };

    function stopIcon(name) {
      cssTargetsOf(name).forEach(function(el) { el.classList.remove('is-play', 'is-once'); });
      lotties[name].forEach(function(anim) { anim.goToAndStop(0, true); });
    }

    // is-play 를 뗐다 붙여야 CSS 애니메이션이 0% 부터 다시 시작한다
    function playIcon(name, once) {
      const targets = cssTargetsOf(name);
      targets.forEach(function(el) { el.classList.remove('is-play', 'is-once'); });
      void document.body.offsetWidth;
      targets.forEach(function(el) {
        el.classList.toggle('is-once', once);
        el.classList.add('is-play');
      });

      lotties[name].forEach(function(anim) {
        anim.loop = !once;
        anim.goToAndPlay(0, true);
      });
    }

    // [데모 전용] 전체 재생 / 랜덤 재생 전환 (라디오 UI). 서비스에 랜덤 재생 원칙을 쓸 경우 아래 순서 로직을 참고한다
    let randomTimer = null;
    let current = null;
    let queue = [];

    // 랜덤 재생 원칙
    // 1. 2.8초마다 1개씩 모션 재생
    // 2. 캠페인이 있을 경우, 첫 번째 캠페인이 우선 재생
    // 3. 모든 아이콘이 한 번씩 재생 후, 다시 랜덤 순서로 재생
    const PRIORITY = 'campaign';

    function shuffle(list) {
      const order = list.slice();
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      return order;
    }

    // 캠페인이 없을 때는 바퀴 경계에서 같은 아이콘이 연달아 나오지 않게 첫 순서를 피한다
    function shuffledOrder(avoidFirst) {
      if (ICONS.includes(PRIORITY)) {
        return [PRIORITY].concat(shuffle(ICONS.filter(function(name) { return name !== PRIORITY; })));
      }
      const order = shuffle(ICONS);
      if (order.length > 1 && order[0] === avoidFirst) {
        const k = 1 + Math.floor(Math.random() * (order.length - 1));
        [order[0], order[k]] = [order[k], order[0]];
      }
      return order;
    }

    function playRandomNext() {
      if (queue.length === 0) queue = shuffledOrder(current);
      const next = queue.shift();
      if (current) stopIcon(current);
      current = next;
      playIcon(next, true);
    }

    function setMode(mode) {
      clearInterval(randomTimer);
      randomTimer = null;
      current = null;
      queue = [];
      ICONS.forEach(stopIcon);

      if (mode === 'random') {
        playRandomNext();
        randomTimer = setInterval(playRandomNext, RANDOM_INTERVAL);
      } else {
        ICONS.forEach(function(name) { playIcon(name, false); });
      }
    }

    Promise.all(loaded).then(function() {
      const checked = document.querySelector('input[name="play-mode"]:checked');
      setMode(checked.value);
      document.querySelectorAll('input[name="play-mode"]').forEach(function(input) {
        input.addEventListener('change', function() { setMode(input.value); });
      });
    });

    // [데모 전용] 클릭으로 Active 상태 확인
    document.addEventListener('click', function(e) {
      const btn = e.target.closest('.FilterOutlinedItem');
      if (!btn) return;
      const active = btn.classList.toggle('is-active');
      btn.setAttribute('aria-pressed', String(active));
    });

  });
</script>
