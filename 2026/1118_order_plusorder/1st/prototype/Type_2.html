    <!-- content -->
    <div class="scroll-area">
      <!-- 주문서 (Figma 작업 26-11 · node 318-298451) — 반응형 (실제 앱처럼 375 ~ 600)
           폭이 늘어나는 부분(바·박스·버튼·구분선·헤더)은 코드, 크기가 고정인 부분(썸네일+글·섹션 제목·상품 목록)은 3배 이미지
           TitleSection(무배당발 플러스오더 혜택가 상품)은 모션 테스트용 코드 -->
      <div class="order">
        <!-- AppBar (node 318-298923) -->
        <header class="order-appbar">
          <img class="order-appbar-back" src="./src/img/order/ic_arrow_left.svg" width="20" height="20" alt="뒤로">
          <h1 class="order-appbar-title">주문서</h1>
        </header>

        <img style="--w: 375; --h: 47" class="proto-img order-first" src="./src/img/order/items_title.png" width="375" height="47" alt="주문 상품 2개">

        <!-- ListCart 1 (node 318-298459) -->
        <section class="cart-item cart-item--1">
          <img style="--w: 315; --h: 94" class="proto-img" src="./src/img/order/item_1_info.png" width="315" height="94" alt="무신사 스탠다드 홈 &amp; 프로덕트 에어케어 공간탈취제 360g [포레스트] 2팩 1개 3,990원">
          <p class="nudge nudge--mbdb"><img src="./src/img/order/mbdb_logo.png" width="54" height="14" alt="무배당발">22시까지 결제 시 내일(목) 도착 보장</p>
          <p class="nudge nudge--blue">무배당발 상품과 함께 구매 가능 (단독 구매불가)</p>
        </section>

        <!-- ListCart 2 (node 318-298495) -->
        <section class="cart-item cart-item--2">
          <div class="cart-item-info">
            <img style="--w: 315; --h: 86" class="proto-img" src="./src/img/order/item_2_info.webp" width="315" height="86" alt="무신사 스탠다드 신세틱 스웨이드 워크 재킷 L / 1개 100,000원">
            <p class="nudge nudge--mbdb"><img src="./src/img/order/mbdb_logo.png" width="54" height="14" alt="무배당발">오늘 22시까지 결제 시 내일(토) 도착 보장</p>
          </div>
          <button class="line-button" type="button">쿠폰 사용</button>
        </section>

        <!-- TitleSection (node 318-298496): 모션 테스트 영역 -->
        <section class="plus-title" aria-label="무배당발 플러스오더 혜택가 상품">
          <div class="plus-title-row">
            <!-- Type 2 로고: 로티 (src/lottie/type_2_logo.json, 123×14 · 3배 369×42)
                 처음 한 번 끝까지(0 → 959) 재생한 뒤 loopStart(480) ~ loopEnd(959) 구간 반복 -->
            <span class="plus-logo-lottie" id="plusLogoLottie" role="img" aria-label="무배당발 플러스오더"></span>
            <p class="plus-title-text">혜택가 상품</p>
          </div>
          <p class="plus-title-caption">무배당발 상품 주문 시 아래 상품을 혜택가로 구매할 수 있어요</p>
        </section>

        <!-- 혜택가 상품 목록 (node 318-298507, 502×410): 가로 스크롤 — 폭이 넓으면 더 많이 보임 -->
        <div class="plus-list">
          <div class="plus-list-track">
            <img src="./src/img/order/plus_list.png" width="502" height="410" alt="플러스오더 혜택가 상품 10개">
          </div>
        </div>

        <img style="--w: 375; --h: 62" class="proto-img" src="./src/img/order/usedbag_title.png" width="375" height="62" alt="유즈드백 함께 주문하기">

        <!-- 유즈드백 (node 318-298887): 회색 박스는 늘어나고 ⓘ는 오른쪽 끝 -->
        <div class="usedbag">
          <div class="usedbag-box">
            <span class="checkbox" aria-hidden="true"></span>
            <img class="usedbag-item" src="./src/img/order/usedbag_item.png" width="285" height="49" alt="USED BAG (중고 의류 수거용) 0원">
            <img class="usedbag-info" src="./src/img/order/ic_info_16.svg" width="16" height="16" alt="안내">
          </div>
        </div>

        <div class="divider" role="separator"></div>

        <!-- 장바구니 쿠폰 (node 318-298904): 제목은 이미지, 드롭다운은 코드 -->
        <img style="--w: 375; --h: 48" class="proto-img" src="./src/img/order/coupon_title.png" width="375" height="48" alt="장바구니 쿠폰">
        <div class="dropdown">
          <div class="dropdown-box">
            <span class="dropdown-text">사용 가능한 쿠폰 없음</span>
            <img src="./src/img/order/ic_arrow_down_16.svg" width="16" height="16" alt="">
          </div>
        </div>

        <div class="divider" role="separator"></div>

        <!-- ButtonFloating (node 318-298921): 배경 gray100 80% + backdrop blur 20 -->
        <div class="order-floating">
          <button class="order-cta" type="button">52,990원 결제하기</button>
        </div>
      </div>
    </div>

  </div>
