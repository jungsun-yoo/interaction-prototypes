<!DOCTYPE html>
<html lang="ko" data-preload="src/lottie/mbdb_icon.json, src/lottie/mbdb_icon_white.json, src/lottie/mbdb_icon_gray500.json"> <!-- 폰 케이스 없는 캔버스: 크기는 type_1.css 의 --phone-w · --phone-h / data-preload: 로티 json 도 받은 뒤 시작 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F5"> <!-- 사파리 상단·전체 화면 상태바 색: 화면 배경(gray100)과 같게 -->
  <title>Type 1</title>
  <!-- 홈 화면 아이콘으로 열면 사파리 없이 전체 화면 (링크로 열면 기존처럼 사파리)
       상태바 default: 흰 바탕·검정 글자, 콘텐츠는 상태바 아래부터 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Type 1"> <!-- 홈 화면에 추가 기본 이름: common.js가 인덱스 CONFIG.title로 바꿈 -->
  <!-- 파비콘: 무신사 (CDN) -->
  <link rel="icon" type="image/svg+xml" href="https://image.msscdn.net/static/assets/bi/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="https://image.msscdn.net/static/assets/bi/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://image.msscdn.net/static/assets/bi/favicon/favicon-180x180.png">
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css"> <!-- 폰트: Pretendard (무신사 CDN) -->
  <link rel="stylesheet" href="./src/common/mds-motion.css?v=20261124-01">
  <link rel="stylesheet" href="./src/common/common.css?v=20261124-01">
  <link rel="stylesheet" href="./src/mbdb-icon-motion.css?v=20261127-01"> <!-- 무배당발 아이콘 모션 (img-css: 트럭 2장 이동) -->
  <link rel="stylesheet" href="./src/types/type_1.css?v=20261124-01"></head>
<body>

  <!-- 폰 케이스 없는 캔버스 (앱테크 구매챌린지 게이지 모션과 같은 방식): 상태바 · 폰 모서리 · 그림자 없음, 인덱스 바탕색과 같은 gray100
       맨 위 지면 탭(세일판 · 랭킹판) → 고른 지면을 위 Lottie(앱) · 아래 CSS animation(웹) 으로 -->
  <div class="phone">
    <div class="scroll-area">
      <!-- 지면 탭: 세일판 / 랭킹판 — 고른 지면만 보이고, 그 안에서 위 Lottie(앱) · 아래 CSS(웹) -->
      <nav class="surface-tabs" role="tablist" aria-label="지면">
        <button type="button" class="surface-tab" role="tab" data-surface="sale" aria-selected="true">세일판</button>
        <button type="button" class="surface-tab" role="tab" data-surface="ranking" aria-selected="false">랭킹판</button>
      </nav>
      <div class="cmp">

      <section class="cmp-row" data-surface="sale" role="tabpanel">
        <p class="cmp-row-title">TabOutlinedItem - 무배당발</p>
        <div class="cmp-cols">
        <div class="cmp-cell" data-kind="lottie">
          <p class="cmp-cell-label"><b>Lottie</b> · 앱</p>
          <div class="mbdb-shot">
            <img class="proto-img" style="--w: 375; --h: 74" width="375" height="74" src="./src/img/tab_mbdb.png?v=2" alt="세일판 무배당발 탭">
            <button type="button" class="mbdb-tab" aria-pressed="true" style="left: 134.33px">
                      <span class="mbdb-tab-lottie">
                        <span class="is-on mbdb-lottie" data-lottie="mbdb_icon" aria-hidden="true"></span>
                        <span class="is-off mbdb-lottie" data-lottie="mbdb_icon_gray500" aria-hidden="true"></span>
                      </span>
                    </button>
            <button type="button" class="mbdb-tab" aria-pressed="false" style="left: 219.33px">
                      <span class="mbdb-tab-lottie">
                        <span class="is-on mbdb-lottie" data-lottie="mbdb_icon" aria-hidden="true"></span>
                        <span class="is-off mbdb-lottie" data-lottie="mbdb_icon_gray500" aria-hidden="true"></span>
                      </span>
                    </button>
          </div>
        </div>
        <div class="cmp-cell" data-kind="css">
          <p class="cmp-cell-label"><b>CSS animation</b> · 웹</p>
          <div class="mbdb-shot">
            <img class="proto-img" style="--w: 375; --h: 74" width="375" height="74" src="./src/img/tab_mbdb.png?v=2" alt="세일판 무배당발 탭">
            <button type="button" class="mbdb-tab" aria-pressed="true" style="left: 134.33px">
                      <span class="mbdb-tab-symbol">
                        <span class="is-on mbdb-icon-motion is-play" aria-hidden="true"><img src="./src/img/mbdb_symbol_on.png" alt=""><img src="./src/img/mbdb_symbol_on.png" alt=""></span>
                        <span class="is-off mbdb-icon-motion is-play" aria-hidden="true"><img src="./src/img/mbdb_symbol_off.png" alt=""><img src="./src/img/mbdb_symbol_off.png" alt=""></span>
                      </span>
                      <span class="mbdb-tab-logotype">
                        <img class="is-on" src="./src/img/mbdb_logotype_on.png" width="49" height="18" alt="무배당발">
                        <img class="is-off" src="./src/img/mbdb_logotype_off.png" width="49" height="18" alt="무배당발">
                      </span>
                    </button>
            <button type="button" class="mbdb-tab" aria-pressed="false" style="left: 219.33px">
                      <span class="mbdb-tab-symbol">
                        <span class="is-on mbdb-icon-motion is-play" aria-hidden="true"><img src="./src/img/mbdb_symbol_on.png" alt=""><img src="./src/img/mbdb_symbol_on.png" alt=""></span>
                        <span class="is-off mbdb-icon-motion is-play" aria-hidden="true"><img src="./src/img/mbdb_symbol_off.png" alt=""><img src="./src/img/mbdb_symbol_off.png" alt=""></span>
                      </span>
                      <span class="mbdb-tab-logotype">
                        <img class="is-on" src="./src/img/mbdb_logotype_on.png" width="49" height="18" alt="무배당발">
                        <img class="is-off" src="./src/img/mbdb_logotype_off.png" width="49" height="18" alt="무배당발">
                      </span>
                    </button>
          </div>
        </div>
        </div>
      </section>

      <section class="cmp-row" data-surface="ranking" role="tabpanel" hidden>
        <p class="cmp-row-title">무배당발 띠배너<span>위: 미체크 / 아래: 체크</span></p>
        <div class="cmp-cols">
        <div class="cmp-cell" data-kind="lottie">
          <p class="cmp-cell-label"><b>Lottie</b> · 앱</p>
          <div class="mbdb-shot">
            <img class="proto-img" style="--w: 375; --h: 110" width="375" height="110" src="./src/img/banner_mbdb.png?v=2" alt="랭킹판 무배당발 띠배너">
            <span class="mbdb-banner-logo" data-checked="false" style="left: 34px; top: 51px">
                      <span class="mbdb-banner-lottie">
                        <span class="is-on mbdb-lottie" data-lottie="mbdb_icon_white" aria-hidden="true"></span>
                        <span class="is-off mbdb-lottie" data-lottie="mbdb_icon" aria-hidden="true"></span>
                      </span>
                    </span>
            <span class="mbdb-banner-logo" data-checked="true" style="left: 36px; top: 85px">
                      <span class="mbdb-banner-lottie">
                        <span class="is-on mbdb-lottie" data-lottie="mbdb_icon_white" aria-hidden="true"></span>
                        <span class="is-off mbdb-lottie" data-lottie="mbdb_icon" aria-hidden="true"></span>
                      </span>
                    </span>
          </div>
        </div>
        <div class="cmp-cell" data-kind="css">
          <p class="cmp-cell-label"><b>CSS animation</b> · 웹</p>
          <div class="mbdb-shot">
            <img class="proto-img" style="--w: 375; --h: 110" width="375" height="110" src="./src/img/banner_mbdb.png?v=2" alt="랭킹판 무배당발 띠배너">
            <span class="mbdb-banner-logo" data-checked="false" style="left: 34px; top: 51px">
                      <span class="mbdb-banner-symbol">
                        <span class="is-on mbdb-icon-motion is-play" aria-hidden="true"><img src="./src/img/mbdb_symbol_white_h16.png" alt=""><img src="./src/img/mbdb_symbol_white_h16.png" alt=""></span>
                        <span class="is-off mbdb-icon-motion is-play" aria-hidden="true"><img src="./src/img/mbdb_symbol_h16.png" alt=""><img src="./src/img/mbdb_symbol_h16.png" alt=""></span>
                      </span>
                      <span class="mbdb-banner-logotype">
                        <img class="is-on" src="./src/img/mbdb_logotype_white_h16.png" alt="무배당발">
                        <img class="is-off" src="./src/img/mbdb_logotype_h16.png" alt="무배당발">
                      </span>
                    </span>
            <span class="mbdb-banner-logo" data-checked="true" style="left: 36px; top: 85px">
                      <span class="mbdb-banner-symbol">
                        <span class="is-on mbdb-icon-motion is-play" aria-hidden="true"><img src="./src/img/mbdb_symbol_white_h16.png" alt=""><img src="./src/img/mbdb_symbol_white_h16.png" alt=""></span>
                        <span class="is-off mbdb-icon-motion is-play" aria-hidden="true"><img src="./src/img/mbdb_symbol_h16.png" alt=""><img src="./src/img/mbdb_symbol_h16.png" alt=""></span>
                      </span>
                      <span class="mbdb-banner-logotype">
                        <img class="is-on" src="./src/img/mbdb_logotype_white_h16.png" alt="무배당발">
                        <img class="is-off" src="./src/img/mbdb_logotype_h16.png" alt="무배당발">
                      </span>
                    </span>
          </div>
        </div>
        </div>
      </section>
      </div>
    </div>
  </div>

  <!-- 라이브러리: 필요할 때만 CDN으로 붙임
       lottie  https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie_svg.min.js
       swiper  https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js (+ swiper-bundle.min.css) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie_svg.min.js"></script> <!-- 로티 버전 재생 -->
  <script src="https://cdn.jsdelivr.net/npm/motion@14.1.0/dist/motion.js"></script>
  <script src="./src/common/common.js?v=20261124-01"></script>
  <script src="./src/types/type_1.js?v=20261127-01"></script></body>
</html>
