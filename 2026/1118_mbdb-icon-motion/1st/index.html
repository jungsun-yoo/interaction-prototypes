  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    // ================================================================================================= //
    /* 프로젝트 설정
        title·sub: 패널·브라우저 탭 제목 / label: 목록 위 작은 제목
        version: prototype(s)/*.html의 ?v= 값과 같게 올리기 (iframe 캐시 방지)
        items: 항목 추가는 한 줄 (id는 주소 #id로 쓰임)
        figma: 프로젝트 공통 피그마 설명 링크 / 항목별로 다르면 items의 figma에 적기 (항목 값이 우선, 둘 다 없으면 버튼 비활성)
        jira: 프로젝트 공통 Jira 링크 / 항목별로 다르면 items의 jira에 적기 (항목 값이 우선, 둘 다 없으면 버튼 비활성)
        spec: 가이드 md 단독 버튼 (Type_N.html 옆 *_motion-guide.md · *_interaction-guide.md 를 그대로 연결, 복사본 만들지 않음). 비우면 버튼 숨김
              명칭: 저절로 재생되는 연출만 → 모션 가이드 / 탭·스크롤 등 조작이나 상태·화면 전환이 있으면 → 인터랙션 가이드 ('명세' 라는 말은 쓰지 않음)
              선택사항 — 가이드는 zip 안에도 들어가므로, 따로 받게 할지는 프로젝트마다 정함
        download: 내려받을 zip. 최종 결정된 프로토타입만 마지막에 넣음 (비우면 버튼 숨김)
                  download/ 폴더에 prototype(s) 폴더를 통째로 압축. 항목별로 다르면 items의 download
                  zip을 넣은 뒤 prototype(s) 안 파일을 고치면 zip도 다시 만들고 version 올리기
        downloadNote: zip 버튼 아래 안내 문구 (주의 아이콘 자동, <b>로 강조). 비우면 숨김. zip 버튼이 숨으면 같이 숨김, 잠기면 같이 흐리게 (문구는 항상 보임)
        locked: 버튼은 보이되 아직 못 내려받게 흐리게 할 것 ['spec', 'download']. 준비되면 배열에서 빼기 (zip은 그때 download/ 에 넣기)
                항목별로 다르면 items의 locked
        items가 1개면 타입 목록·TYPES 제목·키보드 안내를 숨김
        items[].motion: 오른쪽 MOTION 카드에 보일 모션 설명 [{ title?, note?, items: ['문장' | { text, sub: ['보충'] }] }]. 없으면 카드 숨김
        options: 오른쪽 옵션 카드. 고른 값을 <html data-id="값">으로 프로토타입에 넣음 (CSS는 :root[data-id="값"] 으로 받음)
                 스위치: { id, label, on, off, default } → 켜면 on 값, 끄면 off 값
                 선택:   { id, label, choices: [{ value, label }], default } → 버튼 중 하나 (4개 넘으면 줄바꿈)
                         값은 영문·숫자·-_ 만 (선택 값은 소수점 X → 시간은 ms로: '150' = 0.15초)
                 슬라이더: { id, label, min, max, step, unit, default } → 슬라이더 + 숫자 칸(▲▼ step 단위) 세트
                         값은 숫자 문자열 (step 소수 자리에 맞춤: step 0.05 → '0.15'). 프로토타입에서 data-id="값" + CSS 변수 --opt-id 로 받음
                         예) { id: 'speed', label: '지속 시간', unit: 'ms', min: 0, max: 1000, step: 10, default: '300' }
                         scale: 화면 단위와 프로토타입에 넘길 단위가 다를 때. min·max·step·unit 은 화면 단위, default 는 넘길 단위
                         예) { id: 'hold', label: '노출 시간', unit: '초', min: 3, max: 8, step: 0.5, scale: 1000, default: '3000' } → 화면 3초, 프로토타입 3000(ms)
                            → CSS: transition-duration: calc(var(--opt-speed) * 1ms);
                 note: '캡션' 을 넣으면 옵션 이름 아래 작은 회색 설명. 강조 <b>검정 굵게</b> · <em>파랑 굵게</em>
                       (fileNote · MOTION note·sub 도 같은 강조 태그 사용)
                 notice: '중요 조건' 을 넣으면 주황 i 아이콘 + 연주황 바탕 캡션 (꼭 지켜야 할 값. 예: notice: '최소 3초 노출')
                 when: { id, value } 를 넣으면 그 옵션이 그 값일 때만 쓸 수 있음 (아니면 흐리게)
                 group: '이름' 을 같은 값으로 준 스위치끼리는 하나만 켜짐 (켜면 나머지 꺼짐. 예: 화면 바로보기 스위치들)
                 예) { id: 'preview', label: '로딩 바로보기', on: 'on', off: 'off', default: 'off' },
                     { id: 'stagger', label: '스태거 (초)', default: '150', when: { id: 'preview', value: 'on' },
                       choices: [{ value: '100', label: '0.1' }, { value: '150', label: '0.15' }, { value: '200', label: '0.2' }] }
                 QR·새 창 주소에 ?opt-id=값 으로 들어가고, proto_server.py로 띄우면 같은 와이파이의 폰에도 실시간 반영
                 비우면 옵션 카드 숨김
                 섹션: { section: '제목' } 줄을 넣으면 그 아래 옵션들이 한 묶음 (구분선 + 섹션 제목 + 리셋 아이콘)
                       { section: '제목', card: true } 면 그 아래 옵션들이 별도 카드로 (카드 제목 + 리셋 아이콘)
                       섹션 줄보다 위에 있는 옵션은 기본 OPTIONS 카드. 리셋 아이콘은 그 묶음만 기본값으로 되돌림 (모두 기본값이면 흐림)
                 예) { section: '화면 바로보기' }, { id: 'loading-preview', … }, { section: '로딩', card: true }, { id: 'stagger', … }
        files: FILES 카드에서 내려받을 파일 (로티 json · zip 등 개발 전달용). 항목별로 다르면 items의 files (항목 값이 우선. 항목에 files: [] 면 그 항목만 숨김, 둘 다 없으면 카드 숨김)
               { label: '버튼 글자', file: '경로', name: '받을 파일 이름(생략하면 원래 이름)', sub: true(보조 버튼, 연회색 · 생략하면 주 버튼 검정) }
               FILES 카드는 오른쪽 카드 묶음 맨 위. 버튼 모양은 왼쪽 패널과 같게. 글자: 가이드는 파일 이름 끝부분 'interaction-guide.md' · 'motion-guide.md' (sub) 위, zip 'Download (.zip)' 아래
               fileNote: FILES 카드 아래 작은 설명 (생략 가능)
               예) files: [{ label: 'Lottie', file: 'prototype/src/lottie/ic_search.json' }, { label: 'CSS', file: 'download/icon-css.zip' }]
               프로토타입 zip 을 FILES 에 넣으면 가이드 안내는 정보 아이콘 캡션으로 (공통):
                   files: [{ label: 'motion-guide.md', file: 'prototype/type_1_motion-guide.md', sub: true },
                           { label: 'Download (.zip)', file: 'download/prototype.zip' }],
                   fileNote: '<span class="file-note-info">압축 파일 안의 <b>*_motion-guide.md</b>를 확인해 주세요.</span>'
    */
    var CONFIG = {
      title: '무배당발 아이콘 모션',
      sub: '26-1118 · Prototype',
      label: 'TYPES',
      version: '20261127-01',
      qrHost: '172.30.1.42', // proto_server.py 없이 localhost로 열 때만 쓰는 예비값 (서버로 띄우면 지금 IP를 자동으로 씀)
      figma: 'https://www.figma.com/design/o0jTKUbX15ampUa9e8VUEP/MDS-2.0-%EB%B3%80%EA%B2%BD-%EB%A1%9C%EA%B7%B8-%EA%B3%B5%EC%9C%A0?node-id=9424-5613',
      jira: 'https://musinsa-oneteam.atlassian.net/browse/FT-826',
      spec: '', // 예: 'prototype/mbdb-icon_interaction-guide.md' (가이드를 따로 받게 할 때만, 선택)
      download: '', // 예: 'download/prototype.zip'
      downloadNote: '압축 파일 안의 <b>mbdb-icon_interaction-guide.md</b>를 확인해 주세요.', // zip 버튼 아래 안내 (비우면 숨김)
      locked: [], // 예: ['spec', 'download'] → 버튼만 보이고 흐리게 (최종 전)
      /* 화면 1개면 prototype/, 여러 개면 prototypes/ 폴더 */
      options: [],
      files: [
        { label: 'interaction-guide.md', file: 'prototype/mbdb-icon_interaction-guide.md', sub: true },
        { label: 'Lottie 3종 (.zip)', file: 'download/mbdb_icon_lottie.zip' },
        { label: 'Download (.zip)', file: 'download/prototype.zip', name: '무배당발아이콘모션_prototype.zip' }
      ],
      fileNote: '<span class="file-note-info">압축 파일 안의 <b>mbdb-icon_interaction-guide.md</b>를 확인해 주세요.</span>',
      /* items 항목: { id, title, file } + 선택 qr: false (그 항목만 QR 카드·QR 버튼 숨김, 휴대폰으로 볼 필요 없는 화면) */
      items: [
        { id: 'type1', title: 'Type 1', file: 'prototype/Type_1.html',
          motion: [
            { title: '구현 방식', list: 'dot', items: ['앱은 Lottie 로 제작', '웹은 CSS 로 제작'] }
          ] }
      ]
    };
    // ================================================================================================= //
    
    (function () {
      var TYPES = CONFIG.items;
      var frame = document.getElementById('frame');
      var stage = document.getElementById('stage');
      var typeList = document.getElementById('typeList');
      var qrCard = document.getElementById('qrCard');
      var qrButton = document.getElementById('qrButton');
      var current = null;

      /* 설정 텍스트 채우기 */
      [].forEach.call(document.querySelectorAll('[data-config]'), function (el) {
        el.textContent = CONFIG[el.dataset.config];
      });
      /* 제작 회차: 인덱스가 들어 있는 폴더 이름(1st · 2nd · 3rd …)을 읽어 1st 가 아니면 날짜 줄 'Prototype' 뒤에 붙임 (예: 26-1111 · Prototype · 2nd) */
      var round = (location.pathname.match(/\/(\d+(?:st|nd|rd|th))\/(?:index\.html)?$/) || [])[1];
      if (round && round !== '1st') {
        [].forEach.call(document.querySelectorAll('[data-config="sub"]'), function (el) { el.textContent = CONFIG.sub + ' · ' + round; });
      }
      document.title = CONFIG.title;
      document.getElementById('keyHint').textContent = '키보드 ↑ ↓ 로 전환 · R 다시 재생';
      /* 타입이 1개면 목록·TYPES 제목·키보드 안내 숨김 (전환할 게 없으므로) */
      var multiType = TYPES.length > 1;
      ['typeLabel', 'typeList', 'panelFoot'].forEach(function (id) {
        document.getElementById(id).hidden = !multiType;
      });

      /* 옵션 상태 (CONFIG.options 기본값으로 시작 → 서버에 저장된 값이 있으면 그 값) */
      var OPTION_LINES = CONFIG.options || [];                                    /* 섹션 줄 포함 (그리기용) */
      var OPTIONS = OPTION_LINES.filter(function (o) { return o.id; });           /* 값이 있는 옵션만 */
      var optionValues = {};
      function isSlider(o) { return o.max != null; }
      function defaultOf(o) {
        if (o.default != null && o.default !== '') return String(o.default);
        if (o.choices) return o.choices[0].value;
        return isSlider(o) ? String(o.min) : o.on;
      }
      OPTIONS.forEach(function (o) { optionValues[o.id] = defaultOf(o); });
      function isOptionValue(o, value) {
        if (o.choices) return o.choices.some(function (c) { return c.value === value; });
        if (isSlider(o)) return typeof value === 'string' && value !== '' && isFinite(value) && +value / (o.scale || 1) >= o.min && +value / (o.scale || 1) <= o.max;
        return value === o.on || value === o.off;
      }
      /* group 안에 켜진 스위치가 여럿이면 목록에서 마지막 것만 남김 (예전에 저장된 값 정리) */
      function normalizeGroups() {
        var seen = {};
        OPTIONS.slice().reverse().forEach(function (o) {
          if (!o.group || o.choices || optionValues[o.id] !== o.on) return;
          if (seen[o.group]) optionValues[o.id] = o.off;
          seen[o.group] = true;
        });
      }
      normalizeGroups();
      function onOptionChange() {
        renderOptions(); /* when 조건 다시 반영 */
        applyOptionsToFrame();
        renderQr(current);
        saveOptions();
      }
      var optionScope = location.pathname.replace(/\/[^\/]*$/, '') || '/'; /* 회차 폴더 (/1st) */

      function optionQuery() {
        return OPTIONS.map(function (o) { return '&opt-' + o.id + '=' + encodeURIComponent(optionValues[o.id]); }).join('');
      }

      function fileUrl(type) {
        return type.file + '?v=' + CONFIG.version + optionQuery();
      }

      function findType(id) {
        return TYPES.filter(function (t) { return t.id === id; })[0] || TYPES[0];
      }

      /* iframe 이동: src를 바꾸면 방문 기록이 쌓여 뒤로가기가 iframe만 되돌리므로, 첫 로드 이후엔 replace */
      function loadFrame(url) {
        if (frame.getAttribute('src')) frame.contentWindow.location.replace(url);
        else frame.src = url;
      }

      /* QR 주소 규칙: GitHub Pages·IP 주소면 지금 주소 그대로, localhost면 호스트만 내부 IP로 바꿈
         내부 IP: proto_server.py가 알려주는 지금 IP(autoHost) → 없으면 CONFIG.qrHost */
      var autoHost = '';
      /* 프로토타입 HTML 안에 직접 만든 옵션창 값 → QR 주소 뒤에 붙임 (?이름=값)
         프로토타입이 window.parent.postMessage({ type: 'proto-params', params: { time: '4' } }, location.origin) 로 보냄 (기본값과 다른 것만)
         CONFIG.options(인덱스 옵션 카드) 값은 따로 ?opt-옵션=값 으로 붙음 */
      var protoParams = {};
      function shareUrl(type) {
        var url = new URL(fileUrl(type), location.href);
        if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(url.hostname)) {
          var host = autoHost || CONFIG.qrHost;
          if (!host) return null;
          url.hostname = host;
        }
        Object.keys(protoParams).forEach(function (key) { url.searchParams.set(key, protoParams[key]); });
        return url;
      }

      /* 작업 장소(와이파이)가 바뀌어도 QR이 맞게: 시작할 때·창으로 돌아올 때마다 서버에 지금 IP를 물어봄 */
      function refreshHost() {
        if (!window.fetch) return;
        fetch('/api/host', { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
          .then(function (data) {
            var ip = data && typeof data.ip === 'string' && /^\d{1,3}(\.\d{1,3}){3}$/.test(data.ip) ? data.ip : '';
            if (ip === autoHost) return;
            autoHost = ip;
            if (current) renderQr(current);
          })
          .catch(function () { /* 정적 서버: CONFIG.qrHost 사용 */ });
      }

      /* 선택한 항목이 바뀔 때마다 QR 다시 그림 */
      function renderQr(type) {
        qrCard.hidden = type.qr === false; /* 항목 qr: false 면 QR 카드·QR 버튼 숨김 */
        if (qrCard.hidden) { qrButton.hidden = true; return; }
        var url = shareUrl(type);
        var image = document.getElementById('qrImage');
        document.getElementById('qrTitle').textContent = type.title;
        if (!url) {
          image.innerHTML = '<p class="qr-empty">localhost에서는 CONFIG.qrHost에 내부 IP를 넣거나 IP 주소로 접속하세요</p>';
          image.removeAttribute('href');
          document.getElementById('qrUrl').textContent = '';
          return;
        }
        var qr = qrcode(0, 'M');
        qr.addData(url.href);
        qr.make();
        image.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
        image.href = url.href; /* QR을 누르면 QR과 같은 주소를 새 창으로 */
        document.getElementById('qrUrl').textContent = url.host + url.pathname;
      }

      /* 피그마 링크: 항목 figma → 공통 CONFIG.figma 순서, 없으면 비활성 */
      function renderFigma(type) {
        var link = document.getElementById('figmaLink');
        var url = type.figma || CONFIG.figma;
        if (url) link.href = url;
        else link.removeAttribute('href');
        link.classList.toggle('is-disabled', !url);
        link.title = url ? type.title + ' 피그마 설명 열기' : '피그마 링크가 아직 없습니다 (CONFIG.figma)';
      }

      /* Jira 링크: 항목 jira → 공통 CONFIG.jira 순서, 없으면 비활성 */
      function renderJira(type) {
        var link = document.getElementById('jiraLink');
        var url = type.jira || CONFIG.jira;
        if (url) link.href = url;
        else link.removeAttribute('href');
        link.classList.toggle('is-disabled', !url);
        link.title = url ? type.title + ' Jira 열기' : 'Jira 링크가 아직 없습니다 (CONFIG.jira)';
      }

      /* 다운로드 버튼(md·zip): 항목 값 → 공통 CONFIG 값 순서, 없으면 숨김. 받는 파일 이름은 원래 이름 그대로 */
      function renderDownload(type) {
        var locked = type.locked || CONFIG.locked || [];
        var zip = type.download || CONFIG.download;
        renderFile(document.getElementById('specLink'), type.spec || CONFIG.spec, locked.indexOf('spec') !== -1);
        renderFile(document.getElementById('downloadLink'), zip, locked.indexOf('download') !== -1);
        renderDownloadNote(zip ? (type.downloadNote || CONFIG.downloadNote || '') : '', locked.indexOf('download') !== -1);
      }
      function renderFile(link, file, locked) {
        if (file && !locked) {
          link.href = file + '?v=' + CONFIG.version;
          link.setAttribute('download', file.split('/').pop());
        } else link.removeAttribute('href');
        link.classList.toggle('is-hidden', !file);
        link.classList.toggle('is-locked', !!file && !!locked);
        link.setAttribute('aria-disabled', String(!!locked));
        link.title = !file ? '' : locked ? '아직 내려받을 수 없습니다 (준비 중)' : file.split('/').pop() + ' 내려받기';
      }
      /* zip 아래 안내: 주의 아이콘(주황 원 + 느낌표, 느낌표는 패널 바탕색으로 뚫음) + 문구 */
      function renderDownloadNote(text, locked) {
        var note = document.getElementById('downloadNote');
        note.innerHTML = text ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="11"/>'
          + '<path d="M12 6.5v7" style="stroke: var(--panel-bg)" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.5" style="fill: var(--panel-bg)"/></svg>'
          + '<span>' + text + '</span>' : '';
        note.classList.toggle('is-hidden', !text);
        note.classList.toggle('is-locked', !!text && !!locked);
      }

      /* 프로토타입 옵션창 값이 바뀌면 (postMessage 'proto-params') QR을 실시간으로 다시 그림 */
      window.addEventListener('message', function (e) {
        if (e.origin !== location.origin || e.source !== frame.contentWindow) return;
        if (!e.data || e.data.type !== 'proto-params' || typeof e.data.params !== 'object') return;
        protoParams = e.data.params || {};
        if (current) renderQr(current);
      });

      function select(id) {
        stopAutoplay(); /* 다른 타입으로 바꾸면 자동 재생 끝냄 */
        current = findType(id);
        protoParams = {}; /* 다른 타입으로 바꾸면 값 비움 (새 화면이 다시 보냄) */
        loadFrame(fileUrl(current));
        renderQr(current);
        renderFigma(current);
        renderJira(current);
        renderDownload(current);
        renderFiles(current);
        renderMotion(current);
        document.title = CONFIG.title + ' · ' + current.title;
        /* 다른 사이트(Core UX Interaction Design 의 보기 창) 안에 있으면 지금 타입을 알림 → 그 사이트의 링크 복사·새 창이 #타입 주소로 */
        if (window.parent !== window) window.parent.postMessage({ type: 'proto-index:select', id: current.id }, '*');
        [].forEach.call(typeList.querySelectorAll('.type-button'), function (button) {
          button.classList.toggle('is-active', button.dataset.id === current.id);
        });
        if (location.hash !== '#' + current.id) history.replaceState(null, '', '#' + current.id);
      }

      /* PC 패널 버튼 */
      TYPES.forEach(function (type) {
        var li = document.createElement('li');
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'type-button';
        button.textContent = type.title;
        button.dataset.id = type.id;
        button.addEventListener('click', function () {
          if (current && current.id === type.id) return;
          history.pushState(null, '', '#' + type.id);
          select(type.id);
        });
        li.appendChild(button);
        typeList.appendChild(li);
      });

      /* 옵션: iframe에 바로 적용 · QR 다시 그림 · 서버에 저장(연결된 폰에 실시간) */
      var sideStack = document.getElementById('sideStack');
      var optionCards = document.getElementById('optionCards');

      /* CONFIG.options를 카드 → 섹션 → 옵션 구조로 나눔
         섹션 줄 위의 옵션: 기본 OPTIONS 카드 / { section } : 같은 카드 안 새 섹션 / { section, card: true } : 새 카드 */
      function optionLayout() {
        var cards = [{ title: 'OPTIONS', main: true, sections: [{ title: '', options: [] }] }];
        OPTION_LINES.forEach(function (line) {
          var card = cards[cards.length - 1];
          if (line.section != null && line.card) cards.push({ title: line.section, sections: [{ title: '', options: [] }] });
          else if (line.section != null) card.sections.push({ title: line.section, options: [] });
          else card.sections[card.sections.length - 1].options.push(line);
        });
        cards.forEach(function (card) {
          card.sections = card.sections.filter(function (s) { return s.title || s.options.length; });
        });
        return cards.filter(function (card) {
          return card.sections.some(function (s) { return s.options.length; });
        });
      }

      /* 리셋 아이콘: 그 묶음 옵션을 기본값으로 (이미 모두 기본값이면 흐림) */
      function resetButton(options, name) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-reset';
        btn.title = name + ' 기본값으로';
        btn.setAttribute('aria-label', name + ' 기본값으로');
        btn.disabled = options.every(function (o) { return optionValues[o.id] === defaultOf(o); });
        btn.addEventListener('click', function () {
          options.forEach(function (o) { optionValues[o.id] = defaultOf(o); });
          normalizeGroups();
          onOptionChange();
        });
        return btn;
      }
      function headRow(className, title, options) {
        var head = document.createElement('div');
        head.className = 'option-head';
        var p = document.createElement('p');
        p.className = className;
        p.textContent = title;
        head.appendChild(p);
        head.appendChild(resetButton(options, title));
        return head;
      }

      function applyOptionsToFrame() {
        try {
          var win = frame.contentWindow;
          if (win && win.protoOptions) win.protoOptions.apply(optionValues);
        } catch (e) { /* 다른 출처 */ }
      }

      function saveOptions() {
        if (!window.fetch) return;
        fetch('/api/options?scope=' + encodeURIComponent(optionScope), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(optionValues)
        }).catch(function () { /* 정적 서버: 폰은 QR을 다시 찍어야 반영 */ });
      }

      function renderOptions() {
        optionCards.innerHTML = '';
        optionLayout().forEach(function (card) {
          var el = document.createElement('div');
          el.className = 'option-card';
          var all = [];
          card.sections.forEach(function (s) { all = all.concat(s.options); });
          /* 카드 제목: 기본 카드는 섹션이 없을 때 리셋 없이 'OPTIONS'만, 별도 카드는 제목 + 리셋 */
          if (card.main) {
            var title = document.createElement('p');
            title.className = 'option-title';
            title.textContent = card.title;
            el.appendChild(title);
          } else el.appendChild(headRow('option-title', card.title, all));
          card.sections.forEach(function (s) {
            var box = document.createElement('div');
            box.className = 'option-section';
            if (s.title) box.appendChild(headRow('option-section-title', s.title, s.options));
            s.options.forEach(function (o) { box.appendChild(optionRow(o)); });
            el.appendChild(box);
          });
          optionCards.appendChild(el);
        });
      }

      /* 옵션 한 줄: 선택(choices) 또는 스위치 */
      function optionRow(o) {
          if (o.choices) return choiceRow(o);
          if (isSlider(o)) return sliderRow(o);
          var isOn = optionValues[o.id] === o.on;
          var row = document.createElement('label');
          row.className = 'option-row';
          row.innerHTML = '<span class="option-text"><span class="option-label"></span></span>'
            + '<input class="option-switch" type="checkbox" role="switch">';
          row.querySelector('.option-label').textContent = o.label;
          addNote(row.querySelector('.option-text'), o);
          var input = row.querySelector('.option-switch');
          input.checked = isOn;
          input.addEventListener('change', function () {
            optionValues[o.id] = input.checked ? o.on : o.off;
            /* group: 같은 묶음의 스위치는 하나만 켜짐 → 나머지 끔 */
            if (input.checked && o.group) OPTIONS.forEach(function (other) {
              if (other !== o && other.group === o.group && !other.choices) optionValues[other.id] = other.off;
            });
            onOptionChange();
          });
          return row;
      }

      /* MOTION 카드: 선택한 항목의 motion = [{ title, note?, items: ['문장' | { text, sub: ['보충'] }] }], 없으면 숨김 */
      function renderMotion(type) {
        var groups = type.motion || [];
        var body = document.getElementById('motionBody');
        body.innerHTML = '';
        groups.forEach(function (g) {
          var box = document.createElement('div');
          box.className = 'motion-group';
          if (g.title) { /* 제목 없이 줄만 적어도 됨: { items: [...] } */
            var title = document.createElement('p');
            title.className = 'motion-group-title';
            title.textContent = g.title;
            if (g.note) { var n = document.createElement('span'); n.innerHTML = g.note; title.appendChild(n); }
            box.appendChild(title);
          }
          var list = document.createElement('ul');
          list.className = 'motion-list' + (g.list === 'dot' ? ' is-dot' : ''); /* list: 'dot' 이면 번호 대신 점 */
          (g.items || []).forEach(function (it) {
            var li = document.createElement('li');
            li.appendChild(document.createTextNode(typeof it === 'string' ? it : it.text));
            if (it.sub && it.sub.length) {
              var sub = document.createElement('ul');
              sub.className = 'motion-sub';
              it.sub.forEach(function (t) { var s = document.createElement('li'); s.innerHTML = t; sub.appendChild(s); });
              li.appendChild(sub);
            }
            list.appendChild(li);
          });
          box.appendChild(list);
          body.appendChild(box);
        });
        document.getElementById('motionCard').hidden = !groups.length;
        fitFrame(); /* 카드 묶음 높이가 바뀜 */
      }

      /* FILES 카드: 선택한 항목의 files → 공통 CONFIG.files 순서, 없으면 숨김. 파일마다 ?v= 를 붙여 캐시 방지 */
      function renderFiles(type) {
        var files = (type.files !== undefined ? type.files : CONFIG.files) || []; /* 항목에 files: [] 를 주면 그 항목만 숨김 */
        var list = document.getElementById('fileList');
        var note = document.getElementById('fileNote');
        list.innerHTML = '';
        files.forEach(function (f) {
          var name = f.name || f.file.split('/').pop();
          var a = document.createElement('a');
          a.className = 'file-button' + (f.sub ? ' file-button--sub' : '');
          a.href = f.file + '?v=' + CONFIG.version;
          a.setAttribute('download', name);
          a.title = name + ' 내려받기';
          a.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg><span></span>';
          a.querySelector('span').textContent = f.label || name;
          list.appendChild(a);
        });
        var noteText = type.fileNote || CONFIG.fileNote || '';
        note.innerHTML = noteText; /* <b>·<em> 강조 */
        note.hidden = !noteText;
        document.getElementById('filesCard').hidden = !files.length;
        fitFrame(); /* 카드 묶음 높이가 바뀜 */
      }

      /* 캡션: 옵션의 note(회색 설명) · notice(중요 조건, 주황 i) — CONFIG에서 쓰는 글이라 <b>·<em> 강조 태그 허용 */
      function addNote(target, o, after) {
        var els = [];
        [['note', 'option-note'], ['notice', 'option-notice']].forEach(function (kind) {
          if (!o[kind[0]]) return;
          var el = document.createElement('span');
          el.className = kind[1];
          el.innerHTML = o[kind[0]];
          els.push(el);
        });
        if (after) target.after.apply(target, els);
        else els.forEach(function (el) { target.appendChild(el); });
      }

      /* 슬라이더 + 숫자 입력 세트: 끌면 바로 반영(저장은 잠깐 뒤 한 번), 놓거나 입력을 마치면 다시 그림
         숫자 칸: 직접 입력(Enter·바깥 누르면 적용) · ▲▼ 버튼 · 키보드 ↑↓ 모두 step 단위, min~max 안으로 맞춤 */
      var sliderSaveTimer = null;
      /* scale: 화면 단위와 저장 단위가 다를 때 (예: 화면 '초', 프로토타입 ms → scale 1000). min·max·step·unit 은 화면 단위, default 는 저장 단위 */
      function sliderRow(o) {
        var step = o.step || 1;
        var k = o.scale || 1;
        function toView(stored) { return +stored / k; }
        function toStore(view) { return String(Math.round(+view * k * 1e6) / 1e6); }
        var digits = (String(step).split('.')[1] || '').length;
        function snap(n) {
          n = Math.round((n - o.min) / step) * step + o.min;
          return String(+Math.min(o.max, Math.max(o.min, n)).toFixed(digits)); /* 0.50 → '0.5' */
        }
        var row = document.createElement('div');
        row.className = 'option-row is-slider';
        var off = o.when && optionValues[o.when.id] !== o.when.value;
        if (off) row.classList.add('is-disabled');
        row.innerHTML = '<div class="option-head-line"><span class="option-label"></span></div>'
          + '<div class="option-slider-line"><input class="option-range" type="range">'
          + '<span class="option-number"><label class="option-field"><input type="number" inputmode="decimal"><span class="option-unit"></span></label>'
          + '<span class="option-step"><button type="button" aria-label="올리기"></button><button type="button" aria-label="내리기"></button></span></span></div>';
        row.querySelector('.option-label').textContent = o.label;
        row.querySelector('.option-unit').textContent = o.unit || '';
        row.querySelector('.option-field').classList.toggle('has-unit', !!o.unit);
        addNote(row.querySelector('.option-head-line'), o, true);
        var range = row.querySelector('.option-range');
        var num = row.querySelector('.option-number input');
        var buttons = row.querySelectorAll('.option-step button');
        [range, num].forEach(function (el) { el.min = o.min; el.max = o.max; el.step = step; el.disabled = off; el.setAttribute('aria-label', o.label); });
        /* 단위가 있으면 숫자 칸 너비를 숫자 길이만큼 → 숫자와 단위가 붙어서 가운데 */
        function fitNum() {
          if (o.unit) num.style.width = Math.max(String(num.value).length, 1) * 0.62 + 0.3 + 'em';
        }
        function show(value) {
          range.value = value;
          num.value = value;
          fitNum();
          range.style.setProperty('--fill', (value - o.min) / (o.max - o.min) * 100 + '%');
          buttons[0].disabled = off || +value >= o.max;
          buttons[1].disabled = off || +value <= o.min;
        }
        function commit(value) {
          optionValues[o.id] = toStore(snap(+value));
          onOptionChange();
        }
        optionValues[o.id] = toStore(snap(toView(optionValues[o.id]))); /* CONFIG 기본값도 step에 맞춤 */
        show(toView(optionValues[o.id]));
        range.addEventListener('input', function () {
          var view = snap(+range.value);
          optionValues[o.id] = toStore(view);
          show(view);
          applyOptionsToFrame();
          clearTimeout(sliderSaveTimer);
          sliderSaveTimer = setTimeout(function () { renderQr(current); saveOptions(); }, 150);
        });
        range.addEventListener('change', function () { commit(range.value); });
        num.addEventListener('change', function () {
          if (num.value === '' || !isFinite(num.value)) show(toView(optionValues[o.id])); /* 잘못 입력하면 원래 값 */
          else commit(num.value);
        });
        num.addEventListener('keydown', function (e) { if (e.key === 'Enter') num.blur(); });
        num.addEventListener('input', fitNum);
        buttons[0].addEventListener('click', function () { commit(toView(optionValues[o.id]) + step); });
        buttons[1].addEventListener('click', function () { commit(toView(optionValues[o.id]) - step); });
        return row;
      }

      /* 선택 옵션: 라벨 아래 버튼 묶음 (하나만 눌림) */
      function choiceRow(o) {
        var row = document.createElement('div');
        row.className = 'option-row is-choice';
        if (o.when && optionValues[o.when.id] !== o.when.value) row.classList.add('is-disabled');
        row.innerHTML = '<span class="option-label"></span><div class="option-choices" role="group"></div>';
        row.querySelector('.option-label').textContent = o.label;
        addNote(row.querySelector('.option-label'), o, true);
        var group = row.querySelector('.option-choices');
        group.setAttribute('aria-label', o.label);
        group.style.gridTemplateColumns = 'repeat(' + Math.min(o.choices.length, 4) + ', 1fr)'; /* 4개 넘으면 줄바꿈 */
        o.choices.forEach(function (c) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option-choice';
          btn.textContent = c.label;
          btn.setAttribute('aria-pressed', String(optionValues[o.id] === c.value));
          btn.disabled = row.classList.contains('is-disabled');
          btn.addEventListener('click', function () {
            optionValues[o.id] = c.value;
            [].forEach.call(group.children, function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
            onOptionChange();
          });
          group.appendChild(btn);
        });
        return row;
      }

      function initOptions() {
        if (!OPTIONS.length) return;
        renderOptions();
        fitFrame();
        if (!window.fetch) return;
        /* 서버에 저장된 값이 있으면 이어 씀 (인덱스를 새로고침해도 유지) */
        fetch('/api/options?scope=' + encodeURIComponent(optionScope))
          .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
          .then(function (saved) {
            OPTIONS.forEach(function (o) {
              if (isOptionValue(o, saved[o.id])) optionValues[o.id] = saved[o.id];
            });
            normalizeGroups();
            renderOptions();
            applyOptionsToFrame();
            renderQr(current);
            saveOptions();
          })
          .catch(function () { /* 정적 서버: CONFIG 기본값 사용 */ });
      }

      function replay() {
        stopAutoplay(); /* 자동 재생 중이면 끝냄 */
        setAutoplayState('idle');
        loadFrame(fileUrl(current) + '&t=' + Date.now()); /* 다시 불러와 등장 모션부터 재생 */
      }
      /* 사람이 누른 다시 재생(툴바 버튼 · R 키): PC 화면 + 연결된 폰도 다시 불러옴 (폰 동기화가 켜져 있을 때만 · 서버 없으면 PC만) */
      function replayAll() {
        replay();
        fetch('/api/replay?scope=' + encodeURIComponent(optionScope), { method: 'POST' }).catch(function () {});
      }
      document.getElementById('replayButton').addEventListener('click', replayAll);

      /* FLOW 자동 재생 (프로토타입 src/common/autoplay.js 의 protoAutoplay)
         바로보기 스위치(group 'preview')를 끄고 → 프로토타입을 처음부터 다시 불러온 뒤 → protoAutoplay.start
         상태: idle(▶ 자동 재생) → playing(■ 정지, 옵션 카드 흐리게) → done(↺ 처음으로)
         시나리오가 등록되지 않았으면(protoAutoplay.ready() false) 버튼 비활성 */
      var autoplayCard = document.getElementById('autoplayCard');
      var autoplayButton = document.getElementById('autoplayButton');
      var autoplaying = false;
      var autoplayDone = false;
      var AUTOPLAY_LABELS = { idle: '자동 재생', playing: '정지', done: '처음으로' };
      function setAutoplayState(state) {
        autoplaying = state === 'playing';
        autoplayDone = state === 'done';
        autoplayButton.classList.toggle('is-playing', autoplaying);
        autoplayButton.classList.toggle('is-done', autoplayDone);
        autoplayButton.querySelector('.autoplay-label').textContent = AUTOPLAY_LABELS[state];
        autoplayButton.setAttribute('aria-pressed', String(autoplaying));
        sideStack.classList.toggle('is-autoplaying', autoplaying);
        stage.classList.toggle('is-autoplaying', autoplaying); /* 폰 입력 막기 (CSS) */
        if (autoplaying) blurFrame();
      }
      /* 프로토타입 안에 포커스가 남아 있으면 키보드(방향키 · 스페이스)로 스크롤될 수 있어 빼냄 */
      function blurFrame() {
        try { var el = frame.contentDocument.activeElement; if (el && el.blur) el.blur(); } catch (e) {}
        frame.blur();
      }
      /* 키보드: 프로토타입을 새로 불러올 때마다, 자동 재생 중이면 안에서 누른 키를 막음 */
      frame.addEventListener('load', function () {
        try {
          frame.contentWindow.addEventListener('keydown', function (e) {
            if (autoplaying) { e.preventDefault(); e.stopImmediatePropagation(); }
          }, true);
        } catch (e) {}
      });
      function frameAutoplay() {
        try { return frame.contentWindow.protoAutoplay || null; } catch (e) { return null; }
      }
      function stopAutoplay() {
        if (!autoplaying) return;
        var player = frameAutoplay();
        if (player) player.stop();
        setAutoplayState('idle');
      }
      function startAutoplay() {
        var changed = false;
        OPTIONS.forEach(function (o) {
          if (o.group === 'preview' && !o.choices && optionValues[o.id] !== o.off) { optionValues[o.id] = o.off; changed = true; }
        });
        if (changed) onOptionChange();
        setAutoplayState('playing');
        frame.addEventListener('load', function () {
          var player = frameAutoplay();
          if (!autoplaying || !player || !player.ready()) { setAutoplayState('idle'); return; }
          setTimeout(function () { /* 첫 화면 등장 모션을 잠깐 보여 주고 시작 */
            if (autoplaying) player.start(function () { if (autoplaying) setAutoplayState('done'); });
          }, 800);
        }, { once: true });
        loadFrame(fileUrl(current) + '&t=' + Date.now());
      }
      autoplayButton.addEventListener('click', function () {
        if (autoplayButton.disabled) return;
        if (autoplaying) stopAutoplay();
        else if (autoplayDone) replay(); /* 처음으로 */
        else startAutoplay();
      });
      /* 프로토타입이 autoplay 엔진을 불러왔으면 카드를 보이고, 시나리오가 있을 때만 버튼을 켬 */
      frame.addEventListener('load', function () {
        var player = frameAutoplay();
        autoplayCard.hidden = !player;
        var ok = !!(player && player.ready && player.ready());
        autoplayButton.disabled = !ok;
        if (ok) autoplayButton.removeAttribute('title');
        else autoplayButton.title = '자동 재생 시나리오가 아직 없습니다 (type_N_autoplay.js)';
      });

      /* ▶ 폰 동기화 토글 (proto_server.py, 기본 켜짐)
         켜짐: QR로 접속한 폰이 파일 저장·옵션 변경을 실시간으로 받음. 켤 때 폰을 한 번 새로 불러와 최신으로 맞춤
         꺼짐: 폰과의 실시간 연결을 멈춤 (PC 화면은 계속 자동 반영)
         서버 없이(정적으로) 열면 버튼을 숨김 */
      var syncButton = document.getElementById('syncButton');
      function renderSync(on) {
        syncButton.classList.toggle('is-on', on);
        syncButton.setAttribute('aria-pressed', on ? 'true' : 'false');
        syncButton.dataset.tip = on ? '폰 동기화 켜짐 (P)' : '폰 동기화 꺼짐 (P)';
      }
      function toggleSync() {
        if (syncButton.hidden) return;
        var next = !syncButton.classList.contains('is-on');
        renderSync(next);
        fetch('/api/sync?scope=' + encodeURIComponent(optionScope) + '&on=' + (next ? 1 : 0), { method: 'POST' })
          .then(function (res) { if (!res.ok) throw new Error('sync'); })
          .catch(function () { renderSync(!next); });
      }
      syncButton.addEventListener('click', toggleSync);
      fetch('/api/sync?scope=' + encodeURIComponent(optionScope), { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
        .then(function (data) { renderSync(data.on !== false); syncButton.hidden = false; })
        .catch(function () { /* 정적 서버: 동기화 없음 */ });

      /* 라이브 스트림 (PC 인덱스용, 동기화와 상관없이 항상): 파일 저장 → 인덱스 파일이면 새로고침, 아니면 폰 화면 다시 불러오기
         sync → 다른 창에서 바꾼 동기화 상태를 버튼에 반영 */
      if (window.EventSource) {
        var live = new EventSource('/api/live/stream?role=index&scope=' + encodeURIComponent(optionScope));
        live.onmessage = function (e) {
          var msg;
          try { msg = JSON.parse(e.data); } catch (err) { return; }
          if (msg.type === 'sync') { renderSync(!!msg.on); return; }
          if (msg.type !== 'change') return;
          var indexPath = decodeURI(location.pathname).replace(/\/$/, '/index.html');
          if ((msg.files || []).indexOf(indexPath) !== -1) location.reload();
          else replay();
        };
        live.onerror = function () {
          if (live.readyState === EventSource.CLOSED) live.close(); /* 정적 서버면 연결 포기 */
        };
      }
      document.getElementById('openButton').addEventListener('click', function () {
        window.open(fileUrl(current), '_blank');
      });
      /* 접힌 QR: 툴바 버튼으로 열고 닫기, 바깥을 누르면 닫힘 */
      qrButton.addEventListener('click', function () {
        qrCard.classList.toggle('is-open');
        placeQrPopover();
      });
      document.addEventListener('click', function (e) {
        if (!qrCard.classList.contains('is-open') || qrCard.contains(e.target) || qrButton.contains(e.target)) return;
        qrCard.classList.remove('is-open');
        placeQrPopover();
      });

      /* 키보드: ↑ ↓ 로 타입 전환, R 다시 재생, P 폰 동기화 켜기·끄기, Z 화면에 맞게 확대 (Cmd·Ctrl+R 새로고침은 그대로)
         폰(iframe)을 눌러 포커스가 안으로 들어가도 동작하도록 iframe 문서에도 같은 함수를 붙임 (아래 load)
         프로토타입 안 입력창에서 글자를 칠 때는 무시 */
      function onKey(e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        /* 한글 입력 상태: R 을 누르면 key 가 'ㄱ' 처럼 오므로, 영문 글자가 아니면 자판 위치(KeyR)를 영문 키로 바꿔 다시 처리 */
        if (/^Key[A-Z]$/.test(e.code || '') && e.key && e.key.length === 1 && !/[a-z]/i.test(e.key)) {
          return onKey({ key: e.code.slice(3).toLowerCase(), target: e.target, preventDefault: function () { e.preventDefault(); } });
        }
        /* Esc: 다른 사이트(Core UX Interaction Design 의 보기 창) 안에 들어가 있으면 그 창을 닫아 달라고 알림.
           프로토타입을 클릭하면 키 입력이 이 페이지로 들어와 바깥 사이트가 Esc 를 못 듣기 때문 */
        if (e.key === 'Escape' && window.parent !== window) { window.parent.postMessage({ type: 'proto-index:escape' }, '*'); return; }
        if (e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
        if (e.key === 'r' || e.key === 'R') { replayAll(); return; }
        if (e.key === 'p' || e.key === 'P') { toggleSync(); return; }
        if (e.key === 'z' || e.key === 'Z') { toggleZoom(); return; }
        if (e.key === 'o' || e.key === 'O') { toggleOptions(); return; } /* 확대 중 접힌 옵션 카드 펼치기 · 접기 */
        var index = TYPES.indexOf(current);
        var next = null;
        if (e.key === 'ArrowDown') next = TYPES[(index + 1) % TYPES.length];
        else if (e.key === 'ArrowUp') next = TYPES[(index - 1 + TYPES.length) % TYPES.length];
        if (!next || next === current) return;
        e.preventDefault();
        history.pushState(null, '', '#' + next.id);
        select(next.id);
      }
      document.addEventListener('keydown', onKey);
      /* 다른 사이트(Core UX Interaction Design 의 보기 창) 안에 들어가 있을 때, 그 사이트가 넘겨준 단축키(R·P·Z·↑↓)도 처리.
         보기 창을 열면 키 입력이 바깥 사이트에 있어서 이 페이지가 직접 듣지 못하기 때문 */
      window.addEventListener('message', function (e) {
        if (window.parent === window || e.source !== window.parent) return;
        if (!e.data || e.data.type !== 'proto-index:key' || typeof e.data.key !== 'string') return;
        onKey({ key: e.data.key, target: document.body, preventDefault: function () {} });
      });

      /* 확대 보기: 툴바 돋보기 · Z → 폰을 바탕에 꽉 차게 (다시 누르면 원래 크기)
         확대는 이 인덱스 화면에서만: 서버 저장 · 폰 동기화로 보내지 않음 (QR로 연 폰은 그대로) */
      var zoomed = false;
      var zoomButton = document.getElementById('zoomButton');
      function toggleZoom() {
        zoomed = !zoomed;
        stage.classList.toggle('is-zoomed', zoomed);
        zoomButton.classList.toggle('is-on', zoomed);
        zoomButton.setAttribute('aria-pressed', String(zoomed));
        zoomButton.dataset.tip = zoomed ? '원래 크기 (Z)' : '화면에 맞게 확대 (Z)';
        zoomButton.setAttribute('aria-label', zoomed ? '원래 크기' : '화면에 맞게 확대');
        fitFrame();
      }
      zoomButton.addEventListener('click', toggleZoom);
      /* 확대 배율: 폰(그림자 여백 빼고)이 바탕 위아래 24px 안에 꽉 차게
         조작용 카드(OPTIONS · FLOW)가 있으면 폰 양옆에 카드 자리(ZOOM_SIDE)를 남기고 키움 → 폰과 카드가 겹치지 않음
         그러느라 폰이 꽉 찬 크기의 ZOOM_KEEP 보다 작아지면 자리를 포기하고 꽉 채운 뒤 카드를 접음 (optionsFolded → 툴바 아래 옵션 버튼 · O) */
      var ZOOM_KEEP = 0.85;          /* 카드 자리를 남겨도 이 비율 이상으로 커질 때만 카드를 옆에 둠 */
      var ZOOM_SIDE = 12 + 240 + 16; /* 폰과 간격 + 카드 너비 + 바탕 오른쪽 여백 */
      var optionsFolded = false;
      var optionsButton = document.getElementById('optionsButton');
      var optionsTools = document.getElementById('optionsTools'); /* 옵션 버튼 상자: 툴바와 따로, 툴바 아래에 */
      function zoomScale(frameW, frameH, pad) {
        var phoneW = frameW - pad * 2;
        var full = Math.min((stage.clientWidth - 48) / phoneW, (stage.clientHeight - 48) / (frameH - pad * 2));
        var controls = !!sideStack.querySelector('#optionCards .option-card, #autoplayCard:not([hidden])');
        var room = Math.min(full, (stage.clientWidth - ZOOM_SIDE * 2) / phoneW);
        stage.classList.toggle('is-no-controls', !controls);
        optionsFolded = controls && room < full * ZOOM_KEEP;
        return controls && !optionsFolded ? room : full;
      }
      /* 접힌 옵션 카드 펼치기 · 접기 (확대 중 자리가 모자랄 때만 동작) */
      function toggleOptions(open) {
        open = optionsFolded && (typeof open === 'boolean' ? open : !sideStack.classList.contains('is-open'));
        sideStack.classList.toggle('is-open', open);
        stage.classList.toggle('is-options-open', open);
        optionsButton.setAttribute('aria-expanded', String(open));
      }
      optionsButton.addEventListener('click', function () { toggleOptions(); });

      /* 폰 옆 패널(옵션창·설명창)이 있는 화면: 프로토타입 :root 에 --phone-w(폰 + 간격 + 패널) · --phone-screen-w(폰 화면 너비)
         → 툴바는 폰 화면 오른쪽에, 오른쪽 카드 묶음은 패널 오른쪽에. 0 이면 프레임 전체가 폰 */
      var phoneScreenW = 0;

      /* 화면이 프레임보다 작으면 비율 유지하며 축소 */
      function fitFrame() {
        var style = getComputedStyle(document.documentElement);
        var pad = parseFloat(style.getPropertyValue('--frame-pad'));
        var frameW = parseFloat(style.getPropertyValue('--phone-w')) + pad * 2; /* CSS --frame-w와 같은 식 */
        var frameH = parseFloat(style.getPropertyValue('--phone-h')) + pad * 2;
        if (!zoomed) optionsFolded = false;
        var scale = zoomed ? zoomScale(frameW, frameH, pad) : Math.min(1, stage.clientWidth / frameW, stage.clientHeight / frameH);
        frame.style.setProperty('--frame-scale', scale);
        stage.classList.toggle('is-options-folded', optionsFolded);
        optionsTools.hidden = !optionsFolded;
        if (!optionsFolded) toggleOptions(false);

        /* QR 카드 단계: 폰 왼쪽 여백(바탕 왼쪽 24 + 폰과 간격 16 제외)에 맞춰 전체 → 작은 카드 → 툴바 버튼
           (프레임 안 그림자 여백 --frame-pad 제외한 실제 폰 왼쪽 기준) */
        /* 한 덩어리 가운데 정렬: 폰(+옆 패널) 오른쪽 바깥에 붙는 툴바 · 카드 묶음까지 합친 너비의 가운데에 둠
           자리가 모자라면(덩어리 + 좌우 24 > 바탕) 또는 확대 중이면 폰(프레임)만 가운데 (확대는 zoomScale 이 양옆 카드 자리를 남김) */
        var tools = document.getElementById('stageTools');
        var visualW = (frameW - pad * 2) * scale;                          /* 폰(+옆 패널) 실제 너비 */
        var cardCount = [].filter.call(sideStack.querySelectorAll('.option-card'), function (c) { return !c.hidden; }).length;
        var cardsShown = cardCount > 0;
        /* 이 프로젝트: 카드 수와 상관없이 툴바 오른쪽 (폰 윗선부터). 바탕이 좁아 옆자리가 모자라면 툴바 아래로
           (틀 기본값: 카드 3개 이상만 툴바 오른쪽, 1~2개는 툴바 아래) */
        var cardsBeside = !zoomed && !phoneScreenW && cardCount >= 1
                          && visualW + 12 + tools.offsetWidth + 12 + 240 + 48 <= stage.clientWidth;
        var outside = phoneScreenW ? (cardsShown ? 12 + 240 : 0)           /* 옆 패널 화면: 툴바는 프레임 안, 카드만 바깥 */
                    : cardsBeside ? 12 + tools.offsetWidth + 12 + 240      /* 폰 → 툴바 → 카드 묶음 */
                    : 12 + Math.max(tools.offsetWidth, cardsShown ? 240 : 0);   /* 폰 → 툴바(아래에 카드) */
        var centered = (stage.clientWidth - visualW) / 2;
        var phoneLeft = !zoomed && visualW + outside + 48 <= stage.clientWidth ? (stage.clientWidth - visualW - outside) / 2 : centered;
        frame.style.setProperty('--frame-shift', centered - phoneLeft + 'px');
        var qrRoom = phoneLeft - 24 - 16;
        var folded = qrRoom < parseFloat(style.getPropertyValue('--qr-mini-w'));
        qrCard.classList.toggle('is-mini', !folded && qrRoom < parseFloat(style.getPropertyValue('--qr-card-w')));
        qrCard.classList.toggle('is-folded', folded);
        qrButton.hidden = zoomed || !folded || qrCard.hidden; /* 확대 중엔 QR 숨김 */
        if (!folded || zoomed) qrCard.classList.remove('is-open');

        /* 툴바를 폰 오른쪽 12px·폰 윗선에 붙임. 오른쪽 여백(16px 포함)이 모자라면 바탕 우상단
           프로토타입이 --phone-screen-w를 정하면(폰 옆에 옵션창·설명창이 있어 --phone-w가 더 넓을 때) 그 폰 화면 오른쪽에 붙임 */
        var frameRight = phoneLeft + visualW;                               /* 프레임(폰 + 옆 패널) 오른쪽 */
        var phoneRight = phoneScreenW ? phoneLeft + phoneScreenW * scale : frameRight;
        var phoneTop = (stage.clientHeight - frameH * scale) / 2 + pad * scale;
        var attached = phoneRight + 12 + tools.offsetWidth + 16 <= stage.clientWidth;
        tools.classList.toggle('is-attached', attached);
        tools.style.left = attached ? phoneRight + 12 + 'px' : '';
        tools.style.top = attached ? phoneTop + 'px' : '';
        /* 옵션 버튼(확대 중 카드가 접혔을 때만): 툴바 아래 8px, 툴바와 같은 왼쪽 선 */
        optionsTools.classList.toggle('is-attached', attached);
        optionsTools.style.left = attached ? tools.style.left : '';
        optionsTools.style.top = tools.offsetTop + tools.offsetHeight + 8 + 'px';
        /* 폰 옆 패널이 툴바 바로 아래(8px)에 오도록 지금 툴바 높이를 프로토타입에 알려 줌 (--index-tools-h, 프로토타입 px)
           프로토타입 패널 CSS: margin-top: calc(var(--index-tools-h, 92px) + 8px) → 툴바 버튼 수가 바뀌어도(QR 접힘 등) 가려지지 않음 */
        try {
          var fdoc = frame.contentDocument;
          if (fdoc && phoneScreenW) fdoc.documentElement.style.setProperty('--index-tools-h', Math.ceil(tools.offsetHeight / scale) + 'px');
        } catch (e) { /* 다른 출처 */ }
        /* 오른쪽 카드 묶음
           - 카드 1~2개: 툴바 아래 12px (툴바 왼쪽 선에 맞춤)
           - 카드 3개 이상: 툴바 오른쪽 12px · 폰 윗선부터
           - 폰 옆 패널이 있으면: 패널과 겹치지 않게 프레임 오른쪽 · 폰 윗선부터 */
        /* 이 프로젝트: 바탕이 좁아 툴바 아래에도 카드(240) 자리가 없으면 카드를 접고 툴바 아래 옵션 버튼(O)으로 폰 위에 펼침
           (틀 기본값은 확대 보기 중에만 접힘) */
        if (!zoomed && !phoneScreenW && cardsShown && !cardsBeside && !(attached && phoneRight + 12 + 240 + 16 <= stage.clientWidth)) {
          optionsFolded = true;
          stage.classList.add('is-options-folded');
          optionsTools.hidden = false;
        }
        var stackTop = phoneScreenW || cardsBeside ? phoneTop : tools.offsetTop + tools.offsetHeight + 12;
        if (optionsFolded) stackTop = optionsTools.offsetTop + optionsTools.offsetHeight + 8; /* 접힘: 옵션 버튼 아래에 펼침 */
        var stackX = phoneScreenW ? frameRight : cardsBeside ? phoneRight + 12 + tools.offsetWidth : phoneRight;
        var stackAttached = (phoneScreenW || attached) && stackX + 12 + 240 + 16 <= stage.clientWidth;
        if (optionsFolded) stackAttached = false; /* 접힘: 폰 옆이 아니라 바탕 오른쪽(툴바 아래)에 폰 위로 겹쳐 펼침 */
        sideStack.classList.toggle('is-attached', stackAttached);
        sideStack.style.left = stackAttached ? stackX + 12 - 24 + 'px' : ''; /* 그림자 여백 24 만큼 왼쪽으로 */
        sideStack.style.top = stackTop + 'px';
        sideStack.style.maxHeight = stage.clientHeight - stackTop + 'px'; /* 바탕 아래까지 (안쪽 아래 여백 24), 넘치면 묶음 안 스크롤 */
        placeQrPopover();
      }

      /* 접힌 QR 팝오버: 툴바 아래 8px, 툴바 오른쪽 끝에 맞춤 (폰 위에 겹쳐 뜸) */
      function placeQrPopover() {
        var open = qrCard.classList.contains('is-open');
        var tools = document.getElementById('stageTools');
        qrCard.style.left = open ? tools.offsetLeft + tools.offsetWidth - qrCard.offsetWidth + 'px' : '';
        qrCard.style.top = open ? tools.offsetTop + tools.offsetHeight + 8 + 'px' : '';
      }
      /* 바탕(폰 바깥)에서 굴린 세로 휠을 iframe 안 프로토타입 스크롤로 넘김 (pageScroll: prototype(s)/src/common/common.js) */
      stage.addEventListener('wheel', function (e) {
        var win = frame.contentWindow;
        if (!e.deltaY || !win || !win.pageScroll) return;
        e.preventDefault();
        if (autoplaying) return; /* 자동 재생 중엔 바탕 휠도 프로토타입으로 넘기지 않음 */
        win.pageScroll.scrollByWheel(e);
      }, { passive: false });

      /* 프로토타입을 불러올 때마다 그 폰 크기(common.css --phone-w·--phone-h)를 index에 옮김 → --frame-w·--frame-h는 calc로 따라감 */
      frame.addEventListener('load', function () {
        var doc = frame.contentDocument;
        if (!doc) return;
        doc.addEventListener('keydown', onKey); /* 폰 안에 포커스가 있어도 단축키 동작 */
        applyOptionsToFrame();
        var phone = getComputedStyle(doc.documentElement);
        var w = parseFloat(phone.getPropertyValue('--phone-w'));
        var h = parseFloat(phone.getPropertyValue('--phone-h'));
        phoneScreenW = parseFloat(phone.getPropertyValue('--phone-screen-w')) || 0; /* 없으면 0 → 프레임 오른쪽 기준 */
        if (!w || !h) return;
        document.documentElement.style.setProperty('--phone-w', w + 'px');
        document.documentElement.style.setProperty('--phone-h', h + 'px');
        fitFrame();
      });
      new ResizeObserver(fitFrame).observe(stage); /* 창 크기·레이아웃이 바뀌면 축소·QR 단계·툴바 위치 다시 계산 */
      window.addEventListener('popstate', function () { select(location.hash.slice(1)); });

      fitFrame();
      select(location.hash.slice(1));
      initOptions();
      refreshHost();
      window.addEventListener('focus', refreshHost);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshHost(); });
    })();
  </script>

</body>
</html>
