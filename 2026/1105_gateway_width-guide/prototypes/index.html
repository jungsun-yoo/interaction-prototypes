<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게이트웨이 너비 가이드</title>
  <link rel="stylesheet" href="css/guide.css" />
</head>
<body>
  <div class="body">
  <nav class="devices" aria-label="Screen 선택">
    <p class="devices__title">크기</p>
    <div class="sizes">
      <div class="size">
        <span class="size__label">화면</span>
        <input id="w" type="number" min="280" max="1400" aria-label="너비" />
        <span class="size__x">×</span>
        <input id="h" type="number" min="300" max="1600" aria-label="높이" />
      </div>
      <div class="size">
        <label class="size__label" for="s">상태바</label>
        <input id="s" type="number" min="0" max="120" aria-label="상태바 높이" />
      </div>
    </div>

    <p class="devices__title">노출</p>
    <div class="slots" aria-label="노출">
      <label><input type="checkbox" data-slot="strip" checked />띠배너</label>
      <label><input type="checkbox" data-slot="ad" checked />광고</label>
    </div>

    <p class="devices__title">Screen</p>
    <div id="deviceList"></div>
  </nav>

  <div class="main">
  <!-- 배지는 폰과 같은 작업 영역 기준으로 가운데 정렬 -->
  <header class="toolbar">
    <div class="toolbar__left">
      <div class="mode" role="group" aria-label="AS-IS / TO-BE">
        <button class="mode-btn" type="button" data-mode="asis">AS-IS</button>
        <button class="mode-btn" type="button" data-mode="tobe">TO-BE</button>
      </div>
      <label class="guide-toggle"><input id="guideToggle" type="checkbox" checked />가이드라인</label>
      <label class="max-height">최대높이 <input id="maxHeight" type="number" min="10" max="100" value="88" aria-label="최대 높이 비율" />%</label>
    </div>
    <span id="badge" class="badge"></span>
  </header>
  <div class="ruler" aria-hidden="true">
    <div id="rulerBar" class="ruler__bar"></div>
  </div>

  <main class="stage">
    <aside id="memo" class="memo is-hidden" aria-label="게이트웨이 규칙 메모">
      <div id="memoBody" class="memo__body">
        <div id="memoContent"></div>
        <button id="memoClose" class="memo__close" type="button" aria-expanded="true" aria-controls="memoBody" aria-label="가이드 접기">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <button id="memoTab" class="memo__tab" type="button" aria-expanded="true" aria-controls="memoBody" tabindex="-1">가이드<span class="memo__arrow" aria-hidden="true">▸</span></button>
    </aside>
    <div class="device">
      <div id="guide" class="guide" aria-hidden="true" hidden>
        <div id="guideRange" class="guide__range"><span class="guide__label">콘텐츠 영역</span></div>
        <div id="guideLine" class="guide__line"><span id="guideLineLabel" class="guide__label">88% 지점</span></div>
      </div>
      <div id="phone" class="phone">
        <iframe title="게이트웨이"></iframe>
        <div id="statusbar" class="statusbar" aria-hidden="true"></div>
        <div id="systemAreas" aria-hidden="true"></div>
        <div id="tooltip" class="tooltip"></div>
      </div>
      <div class="handle handle--x" data-axis="x" aria-label="너비 조절"></div>
      <div class="handle handle--y" data-axis="y" aria-label="높이 조절"></div>
      <div class="handle handle--xy" data-axis="xy" aria-label="너비·높이 조절"></div>
      <p id="warnNote" class="warn-note" role="status" hidden>
        <span class="warn-note__icon" aria-hidden="true">!</span><span id="warnNoteText"></span>
      </p>
    </div>
  </main>
  </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
