<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype</title>
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css">
  <style>
    /* ════════════════════════════════════════════════════
        프로토타입 인덱스 (재사용: 아래 script의 CONFIG만 수정)
        좌측 패널: 제목·부제·Figma·Jira 링크 / 우측: prototypes/ 화면을 꽉 채워 표시
       ════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --panel-w: 240px;
      --panel-bg: #1c1c1e;
      --panel-line: rgba(255, 255, 255, 0.08);
      --panel-text: #fff;
      --panel-sub: rgba(255, 255, 255, 0.45);
      --canvas-bg: #f0f0f0;
    }

    html, body {
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; /* Pretendard 우선, 없으면 Apple 시스템 폰트 */
      background: var(--canvas-bg);
    }
    .layout { display: grid; grid-template-columns: var(--panel-w) 1fr; height: 100%; }

    /* --- 좌측 패널 --- */
    .panel { display: flex; flex-direction: column; background: var(--panel-bg); color: var(--panel-text); }
    .panel-head { padding: 24px 20px 20px; border-bottom: 1px solid var(--panel-line); }
    .panel-title { font-size: 18px; font-weight: 700; line-height: 24px; }
    .panel-sub { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--panel-sub); }
    /* 외부 링크 칩(Figma·Jira): 제목 아래 가로 배치
       Figma는 주소가 없으면 비활성, Jira는 주소가 없으면 숨김 */
    .panel-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .panel-link { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 12px; font-weight: 600; line-height: 16px; text-decoration: none; }
    .panel-link:hover { background: rgba(255, 255, 255, 0.16); }
    .panel-link svg { flex-shrink: 0; display: block; }
    .panel-link-arrow { color: var(--panel-sub); font-weight: 400; }
    .panel-link.is-disabled { opacity: 0.35; pointer-events: none; }
    .panel-link.is-hidden { display: none; }

    /* --- 우측: 프로토타입 화면 --- */
    .stage { position: relative; overflow: hidden; }
    .stage-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>

  <div class="layout">
    <aside class="panel">
      <div class="panel-head">
        <p class="panel-title" data-config="title"></p>
        <p class="panel-sub" data-config="sub"></p>
        <div class="panel-links">
          <a class="panel-link is-disabled" id="figmaLink" target="_blank" rel="noopener">
            <svg width="10" height="15" viewBox="0 0 38 57" aria-hidden="true"><path fill="#1abcfe" d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z"/><path fill="#0acf83" d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z"/><path fill="#ff7262" d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z"/><path fill="#f24e1e" d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z"/><path fill="#a259ff" d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z"/></svg>
            <span>Figma</span>
            <span class="panel-link-arrow">↗</span>
          </a>
          <a class="panel-link is-hidden" id="jiraLink" target="_blank" rel="noopener">
            <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path fill="#2684ff" d="M11.53 2c0 2.4 1.97 4.35 4.35 4.35h1.78v1.7c0 2.4 1.94 4.34 4.34 4.35V2.84a.84.84 0 0 0-.84-.84H11.53z"/><path fill="#2684ff" opacity=".8" d="M6.77 6.8a4.36 4.36 0 0 0 4.34 4.34h1.8v1.72a4.36 4.36 0 0 0 4.34 4.34V7.63a.84.84 0 0 0-.83-.83H6.77z"/><path fill="#2684ff" opacity=".65" d="M2 11.6c0 2.4 1.95 4.34 4.35 4.34h1.78v1.72c.01 2.39 1.95 4.33 4.34 4.34v-9.57a.84.84 0 0 0-.84-.84H2z"/></svg>
            <span>Jira</span>
            <span class="panel-link-arrow">↗</span>
          </a>
        </div>
      </div>
    </aside>
    <main class="stage">
      <iframe class="stage-frame" id="frame" title="프로토타입"></iframe>
    </main>
  </div>

  <script>
    // ================================================================================================= //
    /* 프로젝트 설정
        title·sub: 패널·브라우저 탭 제목
        version: 파일을 고치면 올리기 (iframe 캐시 방지)
        file: 오른쪽에 띄울 프로토타입 화면
        figma: 피그마 링크 (없으면 버튼 비활성) / jira: Jira 링크 (없으면 버튼 숨김)
    */
    var CONFIG = {
      title: '게이트웨이 너비 가이드',
      sub: '26-1105 · Prototype',
      version: '20261105-2',
      file: 'prototypes/index.html',
      figma: 'https://www.figma.com/design/qgf78miXjE8bsy68Dspuxw/%ED%99%94%EB%A9%B4%EB%85%BC%EC%9D%98-6?node-id=3960-15166&t=82yBfaKfcLolmQxn-4',
      jira: 'https://jira.team.musinsa.com/browse/PD-10543'
    };
    // ================================================================================================= //

    (function () {
      /* 설정 텍스트 채우기 */
      [].forEach.call(document.querySelectorAll('[data-config]'), function (el) {
        el.textContent = CONFIG[el.dataset.config];
      });
      document.title = CONFIG.title;

      /* 외부 링크: Figma 는 없으면 비활성, Jira 는 없으면 숨김 */
      function renderLink(id, url, hiddenClass) {
        var link = document.getElementById(id);
        if (url) link.href = url;
        else link.removeAttribute('href');
        link.classList.toggle(hiddenClass, !url);
      }
      renderLink('figmaLink', CONFIG.figma, 'is-disabled');
      renderLink('jiraLink', CONFIG.jira, 'is-hidden');

      document.getElementById('frame').src = CONFIG.file + '?v=' + CONFIG.version;
    })();
  </script>

</body>
</html>
