<!DOCTYPE html>
<html lang="ko" data-phone="375" class="is-header-fixed"> <!-- 취향선택브랜드 Type_1.html 안 iframe(#homePage)으로 띄움. 주소 ?embed=1 이면 폰 프레임 없이 꽉 채움 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A1B1F"> <!-- 사파리 상단·전체 화면 상태바 색: 무신사 헤더 색 -->
  <title>무신사 홈</title>
  <!-- 임베드: 취향선택브랜드 Type_1.html 안 iframe(?embed=1) → 폰 프레임 · 둥근 모서리 없이 iframe을 꽉 채움 (home.css :root.is-embed) -->
  <script>if (/[?&]embed=1\b/.test(location.search)) document.documentElement.classList.add('is-embed');</script>
  <!-- 홈 화면 아이콘으로 열면 사파리 없이 전체 화면 (링크로 열면 기존처럼 사파리)
       상태바 default: 흰 바탕·검정 글자, 콘텐츠는 상태바 아래부터 -->

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" type="image/png" sizes="32x32" href="https://image.msscdn.net/static/assets/bi/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://image.msscdn.net/static/assets/bi/favicon/favicon-180x180.png">
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css"> <!-- 폰트: Pretendard (무신사 CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css">
  <link rel="stylesheet" href="./src/common/mds-motion.css?v=20261115-12">
  <link rel="stylesheet" href="./src/common/common.css?v=20261115-12"> <!-- 폰 프레임 · 스크롤 영역 · 상태바 -->
  <!-- 영역별 스타일: src/common/영역/ 폴더 단위로 떼어 다른 프로젝트에 재사용 (각 파일 맨 위에 HTML 구조 적어 둠) -->
  <link rel="stylesheet" href="./src/common/storeheader/storeheader.css?v=20261115-12">
  <link rel="stylesheet" href="./src/common/bigbanner/bigbanner.css?v=20261115-12">
  <link rel="stylesheet" href="./src/common/quickmenu/quickmenu.css?v=20261115-12">
  <link rel="stylesheet" href="./src/common/tastebrand/tastebrand.css?v=20261115-12">

</head>
<body>

  <!-- 무신사 홈만 (26-1105 [앱바] 앱테크진입점모션 2nd에서 가져옴: 다른 전문관 · 광고판 · 전문관 전환 뺌) -->
  <div class="phone" data-store="musinsa">

    <div class="status-bar" aria-hidden="true">
      <span class="status-bar-time">9:41</span>
      <svg class="status-bar-icons" width="51.4012" height="13" viewBox="26 0 51.4012 13" fill="none">
        <!-- wifi -->

          <path d="M50 4C50 1.79086 51.7909 0 54 0H71C73.2091 0 75 1.79086 75 4V9C75 11.2091 73.2091 13 71 13H54C51.7909 13 50 11.2091 50 9V4Z" fill-rule="evenodd" clip-rule="evenodd"/>

        <path opacity="0.35" d="M54 13H71C73.2091 13 75 11.2091 75 9V4C75 1.79086 73.2091 0 71 0H54C51.7909 0 50 1.79086 50 4V9C50 11.2091 51.7909 13 54 13Z" stroke-width="2.11017" stroke="currentColor" mask="url(#statusBarBatteryMask)"/>

      </svg>
    </div>

    <!-- header: 앱바 + 검색창 + 탭 한 덩어리. 상태바 바로 아래, 스크롤 시 탭만 상태바 밑에 남음 (--header-offset) -->
    <header class="header">
      <div class="appbar">
        <!-- 로고: 앞부분 + 뒷부분 (무신사스토어는 앞부분만) + 게이트웨이 버튼 로티 (갭 없이 붙임) -->
        <div class="appbar-brand">
        <div class="appbar-logo" data-logo="musinsa">
          <img class="appbar-logo-front" src="src/img/appbar/logo_front_musinsa.svg" alt="MUSINSA" width="81" height="20">
        </div>
        <div class="appbar-gateway" id="appbarGateway" aria-hidden="true"></div>
        </div>

        <div class="appbar-icons">
          <!-- 체크인 (모든 전문관): 핀 아이콘(Figma 앱테크 2.0 94556:340387) + "이벤트" 배지. 핀은 svg를 마스크로 써서 전문관 아이콘 색을 따름
               배지 모양 · 색은 type_1.css, 등장 · 사라짐 반복 모션은 type_1.js -->
          <div class="appbar-icon appbar-icon--checkin">
            <span class="appbar-checkin-pin" role="img" aria-label="체크인"></span>
            <span class="appbar-checkin-badge" id="checkinBadge">이벤트</span>
          </div>
          <div class="appbar-icon appbar-icon--reward">
            <span class="appbar-reward-dot" aria-hidden="true"></span> <!-- 앱테크 아이콘 오른쪽 위 점 (모든 스토어, 1st Type 3과 같은 4px) · 색은 type_1.css -->
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M19.3333 10.15L16.4707 18.8722C16.4678 18.881 16.4554 18.881 16.4525 18.8722L14.0091 11.3114C14.0062 11.3026 13.9938 11.3026 13.9909 11.3114L11.5475 18.8722C11.5446 18.881 11.5322 18.881 11.5293 18.8722L8.66667 10.15M10 14.3028H7M21 14.3028H18" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="14" cy="14" r="9.8" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <!-- 앱테크 아이콘 모션: 모든 스토어, 아이콘 색별 투명 로티 (src/lottie/ic_appbar_apptech_white · black · kids.json)
                 평상시 · 광고판 공통 (배경 투명). 어떤 스토어가 어떤 파일인지 · 재생 타이밍은 type_1.js -->
            <span class="appbar-reward-lottie" id="rewardLottie" aria-hidden="true"></span>
          </div>
          <div class="appbar-icon appbar-icon--alarm">
            <svg width="28" height="28" viewBox="36 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M54.2 19.6C54.2 21.9196 52.3196 23.8 50 23.8C47.6804 23.8 45.8 21.9196 45.8 19.6M43 11.2C43 7.33402 46.134 4.20001 50 4.20001C53.866 4.20001 57 7.33402 57 11.2V16.52C57 17.4363 58.2289 18.3482 59.2303 18.9391C59.5101 19.1042 59.3927 19.6 59.0678 19.6H40.9322C40.6073 19.6 40.4899 19.1042 40.7697 18.9391C41.7711 18.3482 43 17.4363 43 16.52V11.2Z" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <span class="appbar-badge"></span>
          </div>
          <div class="appbar-icon appbar-icon--cart">
            <svg width="28" height="28" viewBox="72 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M82.5 10.5V7.70001C82.5 5.76702 84.067 4.20001 86 4.20001C87.933 4.20001 89.5 5.76702 89.5 7.70001V10.5M94.4 10.8V22.8C94.4 22.9657 94.2657 23.1 94.1 23.1H77.9C77.7343 23.1 77.6 22.9657 77.6 22.8V10.8C77.6 10.6343 77.7343 10.5 77.9 10.5H94.1C94.2657 10.5 94.4 10.6343 94.4 10.8Z" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 검색창: 문구 · 렌즈 로티는 storeheader.js -->
      <div class="search-bar">
        <div class="search-field">
          <span class="search-text" id="searchText"></span>
          <div class="search-lens" id="searchLens" aria-hidden="true"></div>
          <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M14.4 14.4L19.8 19.8M16.2 10.2C16.2 13.5137 13.5137 16.2 10.2 16.2C6.8863 16.2 4.20001 13.5137 4.20001 10.2C4.20001 6.8863 6.8863 4.20001 10.2 4.20001C13.5137 4.20001 16.2 6.8863 16.2 10.2Z" stroke="currentColor"/>
          </svg>
        </div>
      </div>

      <!-- 탭: 전문관별 TabUnderline (색은 common.css). 광고탭 로티는 전문관별로 type_1.js에서 교체. 추천 · 광고탭만 클릭 -->
      <nav class="tab-underline" aria-label="전문관 메뉴">
        <button class="tab-item" type="button">콘텐츠</button>
        <button class="tab-item is-clickable is-selected" id="tabRecommend" type="button" aria-current="page">추천</button>
        <button class="tab-item tab-item--ad" type="button" aria-label="광고 CHANEL"> <!-- 광고판 진입 없음 (is-clickable 뺌) -->
          <span class="tab-ad-lottie" id="tabAdLottie" aria-hidden="true"></span>
          <span class="tab-ad-label" aria-hidden="true">AD</span>
        </button>
        <button class="tab-item" type="button">랭킹</button>
        <button class="tab-item" type="button">세일</button>
        <button class="tab-item" type="button">발매</button>
      </nav>
    </header>

    <!-- content: 헤더 아래 영역 -->
    <div class="scroll-area">
      <!-- 빅배너: 슬라이드는 type_1.js의 BIG_BANNERS 목록으로 생성 -->
      <div class="big-banner swiper">
        <div class="swiper-wrapper"></div>
      </div>


      <!-- 퀵메뉴: 줄별 전체 길이 캡처(3배수)를 실제 크기로 배치, 가로 스크롤. data-store에 맞는 것만 보임 -->
      <div class="quick-menu quick-menu--highlight" data-quick="musinsa"><div class="quick-menu-rows"><img src="src/img/quickmenu/quickMenu_musinsa_row1.png" alt="하이라이트 퀵메뉴" width="2970" height="60"></div></div>
      <div class="quick-menu quick-menu--onerow" data-quick="musinsa"><div class="quick-menu-rows"><img src="src/img/quickmenu/quickMenu_musinsa_row2.png" alt="퀵메뉴" width="1376.67" height="36"></div></div>

      <!-- 내 취향 브랜드 맞춤 추천 (Figma 304:201941): 브랜드 탭 · 상품은 이미지 가로 스크롤, 타이틀 · 버튼은 화면 폭에 맞춰 코딩 (tastebrand.css) -->
      <section class="taste-brand" aria-label="내 취향 브랜드 맞춤 추천">
        <img class="taste-brand-header" src="src/img/brand/header.png" alt="" width="484" height="125">
        <div class="taste-brand-scroll">
          <img class="taste-brand-content" src="src/img/brand/content.png" alt="어나더오피스 · 레이스 · 헨리코튼 · 라코스테 · 미즈노 · 반스 브랜드 탭과 어나더오피스 상품" width="600" height="617">
        </div>
        <div class="taste-brand-title">
          <div class="taste-brand-heading">
            <img class="taste-brand-icon" src="src/img/brand/ic_ai_star.svg" alt="" width="20" height="20">
            <h2>내 취향 브랜드 맞춤 추천</h2>
          </div>
          <button class="taste-brand-reselect" type="button">다시 선택하기</button>
        </div>
        <button class="taste-brand-button" type="button" aria-label="브랜드 좋아요하기">
          <img src="src/img/brand/btn-text.png" alt="" width="112" height="18">
        </button>
      </section>

      <!-- 캠페인 섹션: 다시 쓸 때는 이 블록을 복사해 이미지 · 로티(data-lottie) · 배경색(--campaign-bg) · 문구만 교체 -->
      <section class="campaign-section" style="--campaign-bg: #A855F7;" aria-label="패션위크 캠페인">
        <img class="campaign-section-image" src="src/img/content.png" alt="패션위크 상품">
        <div class="campaign-section-header">
          <div class="campaign-section-lottie" data-lottie="fashionweek_A855F7" aria-hidden="true"></div>
          <!-- 플로팅 문구: 시간(고정값) ↔ 혜택 문구 교차 -->
          <div class="campaign-section-promo">
            <div class="campaign-section-promo-item is-active"><span class="campaign-section-promo-timer">종료까지 5일 17:47:56 남음</span></div>
            <div class="campaign-section-promo-item"><span>최대 80% 할인 + 최대 30% 쿠폰</span></div>
          </div>
        </div>
      </section>
    </div>


    <!-- 바텀네비 + FAB: 모든 전문관 공통 -->
    <div class="bottom-navigation">

      <div class="fab">
        <div class="fab-item-base fab-share">
          <img src="src/img/fab/ic_share.svg" alt="공유" width="28" height="28">
        </div>

        <div class="fab-gender">
          <img src="src/img/fab/FABGenderItem.png" alt="성별 선택" width="144" height="44">
        </div>

        <div class="fab-right">
          <div class="fab-item-base fab-top">
            <img src="src/img/fab/ic_top.svg" alt="맨 위로" width="28" height="28">
          </div>
          <div class="fab-item-base fab-recent">
            <img class="is-current" src="src/img/fab/FAB_Recent_1.png" alt="최근 본 상품" width="44" height="44">
            <img src="src/img/fab/FAB_Recent_2.png" alt="최근 본 상품" width="44" height="44">
          </div>
        </div>
      </div>

      <div class="tabbar">
        <div class="tabbar-scrim"></div>
        <div class="navigation">
          <div class="navigation-glass"></div>
          <div class="nav-selection"></div>
          <div class="nav-items">
            <div class="nav-item"><img src="src/img/nav/nav_cate.png" alt="카테고리" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav/nav_snap.png" alt="스냅" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav/nav_home.png" alt="홈" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav/nav_like.png" alt="좋아요" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav/nav_my.png" alt="마이" width="64" height="54"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- 라이브러리: 필요한 것만 CDN으로 붙임 -->

  <script src="./src/common/common.js?v=20261115-12"></script> <!-- 스크롤 · 제목 · 로티 · 전문관 전환 -->
  <!-- 영역별 동작: 영역끼리는 'storechange' · 'adboardchange' 이벤트로만 이어짐 -->
  <script src="./src/common/storeheader/storeheader.js?v=20261115-12"></script>
  <script src="./src/common/bigbanner/bigbanner.js?v=20261115-12"></script>
  <script src="./src/common/quickmenu/quickmenu.js?v=20261115-12"></script>
  <script src="./src/common/campaign/campaign.js?v=20261115-12"></script>
