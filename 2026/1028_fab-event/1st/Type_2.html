<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A1B1F">
  <title>EVENT FAB 2</title>
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css">
  <link rel="stylesheet" href="./src/mds-motion.css">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/fab_event_2.css">
</head>
<body>

  <div class="phone">

    <!-- status-bar: 항상 고정 -->
    <div class="status-bar">
      <img src="src/img/StatusBar.png" alt="Status Bar" width="375" height="45">
    </div>

    <!-- header -->
    <header class="header">
      <div class="appbar">
        <img class="appbar-l" src="src/img/AppbarL.png" alt="App Bar Left" width="140" height="52">
        <img class="appbar-r" src="src/img/AppbarR.png" alt="App Bar Right" width="134" height="52">
      </div>
      <div class="search-bar">
        <img class="search-bar-l" src="src/img/TextFieldSearchL.png" alt="Search Field Left" width="153" height="36">
        <img class="search-bar-r" src="src/img/TextFieldSearchR.png" alt="Search Field Right" width="60" height="36">
      </div>
      <div class="musinsa-tab-wrap">
        <img src="src/img/MusinsaTabUnderline.png" alt="Musinsa Tab" width="581" height="48">
      </div>
    </header>

    <!-- content -->
    <div class="scroll-area">
      <div class="big-banner">
        <img src="src/img/BigBanner.png" alt="Big Banner" width="375" height="257">
      </div>
      <div class="content">
        <img src="src/img/Content.png" alt="Content" width="375" height="4793">
        <div class="content-lottie" aria-label="아우터 페스티벌"></div>
      </div>
    </div>

    <!-- navigation -->
    <div class="bottom-navigation">

      <div class="fab">
        <div class="fab-left">

          <div class="fab-event">
            <img class="fab-event-img" src="src/img/FAB_EVENT_60.png" alt="뷰티 홍대 그랜드 오픈">
          </div>
          <div class="fab-item-base fab-share">
            <img src="src/img/ic_share.svg" alt="Share" width="28" height="28">
          </div>
        </div>

        <div class="fab-gender">
          <img src="src/img/FABGenderItem.png" alt="Gender Toggle" width="144" height="44">
        </div>

        <div class="fab-right">
          <div class="fab-item-base fab-top">
            <img src="src/img/ic_top.svg" alt="Top" width="28" height="28">
          </div>
          <div class="fab-item-base fab-recent">
            <img class="is-current" src="src/img/FAB_Recent_1.png" alt="Recent Item" width="44" height="44">
            <img src="src/img/FAB_Recent_2.png" alt="Recent Item" width="44" height="44">
          </div>
        </div>
      </div>

      <div class="tabbar">
        <div class="tabbar-scrim"></div>
        <div class="navigation">
          <div class="navigation-glass"></div>
          <div class="nav-selection"></div>
          <div class="nav-items">
            <div class="nav-item"><img src="src/img/nav_cate.png" alt="카테고리" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav_snap.png" alt="스냅" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav_home.png" alt="홈" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav_like.png" alt="좋아요" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav_my.png" alt="마이" width="64" height="54"></div>
          </div>
        </div>
      </div>

    </div>

  </div>
  <!-- /PHONE -->

  <script src="./src/lib/lottie_svg-5.13.0.min.js"></script>
  <script src="./src/lib/motion-14.1.0.js"></script>
  <script src="./src/script.js"></script>
  <script>
    /* FAB 이벤트(Type_2): 탑버튼이 나오는 100px 이상 스크롤하면 옆으로 숨김, 그 위에서는 전체 노출.
       숨김 중 노출 정도는 스크롤 방향별(내릴 때 / 올릴 때). 이동·회전은 Motion spring.bouncy, 수치는 fab_event_2.css 변수에서 읽음 */
    (function () {
      var HIDE_SCROLL_TOP = 100; /* script.js fab-top 노출 기준과 같게 */
      var scrollArea = document.querySelector('.scroll-area');
      var eventEl = document.querySelector('.fab-event');
      var state = 'full'; /* 'full' | 'down' | 'up' */
      var lastScrollTop = 0;

      function cssNumber(name) {
        return parseFloat(getComputedStyle(eventEl).getPropertyValue(name));
      }

      function hideTarget(direction) {
        var width = cssNumber('--fab-event-w');
        var visible = cssNumber('--fab-event-hide-visible-' + direction);
        var edge = cssNumber('--fab-event-edge-offset');
        return { x: -(width * (1 - visible) + edge), rotate: cssNumber('--fab-event-hide-rotate') };
      }

      function springOptions() {
        return {
          type: 'spring',
          stiffness: cssNumber('--fab-event-hide-spring-stiffness'),
          damping: cssNumber('--fab-event-hide-spring-damping')
        };
      }

      function setState(next) {
        if (next === state) return;
        state = next;
        eventEl.classList.toggle('is-peek', next !== 'full');
        Motion.animate(eventEl, next === 'full' ? { x: 0, rotate: 0 } : hideTarget(next), springOptions());
      }

      scrollArea.addEventListener('scroll', function () {
        var scrollTop = scrollArea.scrollTop;
        var delta = scrollTop - lastScrollTop;
        lastScrollTop = scrollTop;

        if (scrollTop < HIDE_SCROLL_TOP) {
          setState('full');
        } else if (delta > 0) {
          setState('down');
        } else if (delta < 0) {
          setState('up');
        }
      }, { passive: true });
    })();
  </script>

</body>
</html>
