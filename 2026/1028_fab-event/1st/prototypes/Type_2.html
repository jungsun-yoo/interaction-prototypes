<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A1B1F">

  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css">

  <link rel="stylesheet" href="./src/mds-motion.css?v=20261028-10">

  <link rel="stylesheet" href="./src/fab_event_2.css?v=20261028-10">
</head>
<body>

  <div class="phone">

    <!-- status-bar: 항상 고정 -->
    <div class="status-bar">
      <img src="src/img/StatusBar.png" alt="Status Bar" width="375" height="45">
    </div>

    <!-- header -->
    <header class="header">
      <div class="appbar">
        <img class="appbar-l" src="src/img/AppbarL.png" alt="App Bar Left" width="140" height="52">
        <img class="appbar-r" src="src/img/AppbarR.png" alt="App Bar Right" width="134" height="52">
      </div>
      <div class="search-bar">
        <img class="search-bar-l" src="src/img/TextFieldSearchL.png" alt="Search Field Left" width="153" height="36">
        <img class="search-bar-r" src="src/img/TextFieldSearchR.png" alt="Search Field Right" width="60" height="36">
      </div>
      <div class="musinsa-tab-wrap">
        <img src="src/img/MusinsaTabUnderline.png" alt="Musinsa Tab" width="581" height="48">
      </div>
    </header>

    <!-- content -->
    <div class="scroll-area">
      <!-- 빅배너: 슬라이드는 script.js의 BIG_BANNER_IMAGES 목록으로 생성 -->
      <div class="big-banner swiper">
        <div class="swiper-wrapper"></div>
      </div>
      <!-- 퀵메뉴: 600 너비 이미지, 화면보다 넓으면 가로 스크롤 -->
      <div class="quick-menu">
        <img src="src/img/HighlightQuickMenu.png" alt="Highlight Quick Menu" width="600" height="72">
      </div>
      <div class="quick-menu">
        <img src="src/img/MusinsaQuickMenu.png" alt="Musinsa Quick Menu" width="600" height="56">
      </div>
      <div class="content">
        <img src="src/img/Content.png?v=20261028-10" alt="Content" width="375" height="4667">
        <div class="content-lottie" aria-label="아우터 페스티벌"></div>
      </div>
    </div>

    <!-- navigation -->
    <div class="bottom-navigation">

      <div class="fab">
        <div class="fab-left">

          <!-- 이벤트 FAB (Type_2): 내용·스타일은 fab_event_2.css, 동작은 아래 인라인 스크립트에 작성 -->
          <div class="fab-event">
            <img class="fab-event-img" src="src/img/FAB_EVENT_60.png" alt="뷰티 홍대 그랜드 오픈" width="60" height="68">
            <img class="fab-event-arrow" src="src/img/ic_arrow_right_12.svg" alt="" width="12" height="12">
          </div>
          <div class="fab-item-base fab-share">
            <img src="src/img/ic_share.svg" alt="Share" width="28" height="28">
          </div>
        </div>

        <div class="fab-gender">
          <img src="src/img/FABGenderItem.png" alt="Gender Toggle" width="144" height="44">
        </div>

        <div class="fab-right">
          <div class="fab-item-base fab-top">
            <img src="src/img/ic_top.svg" alt="Top" width="28" height="28">
          </div>
          <div class="fab-item-base fab-recent">
            <img class="is-current" src="src/img/FAB_Recent_1.png" alt="Recent Item" width="44" height="44">
            <img src="src/img/FAB_Recent_2.png" alt="Recent Item" width="44" height="44">
          </div>
        </div>
      </div>

      <div class="tabbar">
        <div class="tabbar-scrim"></div>
        <div class="navigation">
          <div class="navigation-glass"></div>
          <div class="nav-selection"></div>
          <div class="nav-items">
            <div class="nav-item"><img src="src/img/nav_cate.png" alt="카테고리" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav_snap.png" alt="스냅" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav_home.png" alt="홈" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav_like.png" alt="좋아요" width="64" height="54"></div>
            <div class="nav-item"><img src="src/img/nav_my.png" alt="마이" width="64" height="54"></div>
          </div>
        </div>
      </div>

    </div>

  </div>
  <!-- /PHONE -->

  <script src="./src/lib/lottie_svg-5.13.0.min.js"></script>
  <script src="./src/lib/motion-14.1.0.js"></script>
  <script src="./src/lib/swiper-bundle-11.1.14.min.js"></script>
  <script src="./src/script.js?v=20261028-10"></script>
  <script>
    /* FAB 이벤트(Type_2): 기본은 왼쪽으로 숨긴 상태(일부만 노출)
       - 페이지 로드: 화면 왼쪽 밖 → 펼침(enter 스프링) → auto-close 후 자동으로 숨김
       - 스크롤로 상단(hide-scroll-top 미만)에 들어오면: 펼침(peek 시간·이징) → peek-hold 후 숨김 / 상단을 벗어나면 바로 숨김
       - 숨김 중 누르거나 오른쪽으로 끌면 펼침(자동으로 닫히지 않음), 거기서 rehide-distance 이상 스크롤하면 숨김
       수치·스프링은 fab_event_2.css 변수에서 읽음 */
    (function () {
      var eventEl = document.querySelector('.fab-event');
      var entered = false;
      var hidden = false;
      var inTop = true; /* 스크롤이 상단 구간(hide-scroll-top 미만)에 있는지 */
      var revealedAt = null; /* 누르기·드래그로 펼친 시점의 스크롤 위치 */
      var anim = null;
      var autoCloseTimer = null;
      var openId = 0; /* 자동 닫힘 예약이 최신 펼침에 대한 것인지 확인 */
      var drag = null; /* 드래그 중: { pointerId, startX, baseX, moved, x } */
      var suppressClick = false; /* 드래그 직후 발생하는 click 무시 */

      function cssNumber(name) {
        return parseFloat(getComputedStyle(eventEl).getPropertyValue(name));
      }

      function spring(prefix) {
        return {
          type: 'spring',
          stiffness: cssNumber('--fab-event-' + prefix + '-spring-stiffness'),
          damping: cssNumber('--fab-event-' + prefix + '-spring-damping')
        };
      }

      /* 화면에 visible 폭만 남기는 x (fab 좌측 패딩만큼 더 밀어야 화면 끝에 맞음) */
      function hideX() {
        return -(eventEl.offsetWidth - cssNumber('--fab-event-hide-visible') + cssNumber('--fab-event-edge-offset'));
      }

      function currentX() {
        return new DOMMatrixReadOnly(getComputedStyle(eventEl).transform).m41;
      }

      /* 상단 복귀 펼침: 시간 + cubic-bezier 이징 (CSS 변수의 cubic-bezier(...)를 숫자 4개로) */
      function peekTransition() {
        var ease = getComputedStyle(eventEl).getPropertyValue('--fab-event-peek-ease').match(/-?[\d.]+/g).map(Number);
        return { duration: cssNumber('--fab-event-peek-duration'), ease: ease };
      }

      /* fromX(없으면 지금 위치)에서 목표 x로 이동 (진행 중인 애니메이션은 멈추고 이어서)
         transition: 스프링 이름('hide' 등) 또는 Motion 옵션 객체 */
      function animateTo(x, transition, fromX) {
        if (anim) anim.stop();
        var options = typeof transition === 'string' ? spring(transition) : transition;
        anim = Motion.animate(eventEl, { x: [fromX === undefined ? currentX() : fromX, x] }, options);
        return anim;
      }

      function cancelAutoClose() {
        clearTimeout(autoCloseTimer);
        autoCloseTimer = null;
        openId++;
      }

      function setHiddenClass(value) {
        hidden = value;
        eventEl.classList.toggle('is-hidden', value); /* 이미지·화살표 전환 (fab_event_2.css) */
      }

      function close() {
        cancelAutoClose();
        if (hidden) return;
        setHiddenClass(true);
        animateTo(hideX(), 'hide');
      }

      /* 펼침. holdVar(CSS 변수 이름)가 있으면 펼침 모션이 끝나고 그 시간 뒤 자동으로 숨김 */
      function open(transition, holdVar, fromX) {
        cancelAutoClose();
        setHiddenClass(false);
        var id = openId;
        animateTo(0, transition, fromX).then(function () {
          if (!holdVar || id !== openId || hidden) return;
          autoCloseTimer = setTimeout(close, cssNumber(holdVar) * 1000);
        });
      }

      function enter() {
        var offscreenX = -(eventEl.offsetWidth + cssNumber('--fab-event-edge-offset'));
        setTimeout(function () {
          entered = true;
          if (inTop) {
            open('enter', '--fab-event-auto-close', offscreenX);
          } else {
            setHiddenClass(true);
            animateTo(hideX(), 'enter', offscreenX);
          }
        }, cssNumber('--fab-event-enter-delay') * 1000);
      }

      function reveal(fromX) {
        revealedAt = pageScroll.get();
        open('reveal', null, fromX); /* 누르기·드래그로 꺼낼 때는 spring.normal, 자동으로 닫히지 않음 */
      }

      eventEl.addEventListener('click', function () {
        if (suppressClick) { suppressClick = false; return; }
        if (hidden && entered) reveal();
      });

      /* 드래그로 꺼내기: 숨김 중 오른쪽으로 끌면 손가락을 따라오고, 놓을 때 drag-reveal 비율 이상이면 펼침 */
      eventEl.addEventListener('pointerdown', function (e) {
        if (!hidden || !entered) return;
        drag = { pointerId: e.pointerId, startX: e.clientX, baseX: currentX(), moved: false, x: currentX() };
        eventEl.setPointerCapture(e.pointerId);
      });

      eventEl.addEventListener('pointermove', function (e) {
        if (!drag || e.pointerId !== drag.pointerId) return;
        var dx = e.clientX - drag.startX;
        if (!drag.moved) {
          if (Math.abs(dx) < cssNumber('--fab-event-drag-start')) return;
          drag.moved = true;
          if (anim) anim.stop();
        }
        var from = hideX();
        var x = Math.min(0, Math.max(from, drag.baseX + dx));
        drag.x = x;
        eventEl.style.transform = 'translateX(' + x + 'px)';
        eventEl.classList.toggle('is-hidden', (x - from) / -from < cssNumber('--fab-event-drag-reveal'));
      });

      function endDrag(e) {
        if (!drag || e.pointerId !== drag.pointerId) return;
        var d = drag;
        drag = null;
        if (!d.moved) return; /* 거의 안 움직였으면 click으로 처리 */
        suppressClick = true;
        setTimeout(function () { suppressClick = false; }, 0); /* click이 안 오는 경우(pointercancel) 대비 */
        var from = hideX();
        if ((d.x - from) / -from >= cssNumber('--fab-event-drag-reveal')) {
          reveal(d.x);
        } else {
          setHiddenClass(true);
          animateTo(from, 'hide', d.x);
        }
      }
      eventEl.addEventListener('pointerup', endDrag);
      eventEl.addEventListener('pointercancel', endDrag);

      pageScroll.target.addEventListener('scroll', function () { /* pageScroll: script.js */
        var scrollTop = pageScroll.get();
        var nowInTop = scrollTop < cssNumber('--fab-event-hide-scroll-top');
        if (nowInTop !== inTop) {
          inTop = nowInTop;
          revealedAt = null;
          if (!entered || drag) return;
          if (inTop) open(peekTransition(), '--fab-event-peek-hold'); /* 상단에 들어오면 0.5s power3 easeOut으로 펼쳤다가 닫힘 */
          else close();
          return;
        }
        if (revealedAt !== null && Math.abs(scrollTop - revealedAt) >= cssNumber('--fab-event-rehide-distance')) {
          revealedAt = null;
          close();
        }
      }, { passive: true });

      inTop = pageScroll.get() < cssNumber('--fab-event-hide-scroll-top');
      if (document.readyState === 'complete') enter();
      else window.addEventListener('load', enter);
    })();
  </script>

</body>
</html>
