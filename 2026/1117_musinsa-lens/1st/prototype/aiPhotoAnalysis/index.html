              </div></div></div>
              <div class="IconAIContainer" role="status">
                <div class="IconAI" aria-hidden="true">

                    <span><img src="../src/components/IconAILoading/img-css/IconAI.svg" width="32" height="32" alt=""></span>
                    <span><img src="../src/components/IconAILoading/img-css/IconAI.svg" width="32" height="32" alt=""></span>
                    <span><img src="../src/components/IconAILoading/img-css/IconAI.svg" width="32" height="32" alt=""></span>
                    <span><img src="../src/components/IconAILoading/img-css/IconAI.svg" width="32" height="32" alt=""></span>

                </div>
                <div class="LoadingMsg"><p data-text="AI가 사진을 분석중입니다">AI가 사진을 분석중입니다</p></div>
              </div>
            </div>
          </section>

            <img class="crop-photo" alt="검색한 사진">
            <div class="crop-dim" aria-hidden="true"></div>
            <img class="crop-photo crop-reveal" alt=""> <!-- 밝은 창: clip-path로 잘라 이동 -->
            <!-- 모서리 4개: 9×9 선 하나(왼쪽 위 모양)를 뒤집어 씀. 선 안쪽이 밝은 창 테두리에 맞닿음 (Figma box 11890:117380) -->
            <div class="crop-corner is-tl"><img data-src="img/result/crop-corner.svg" width="9" height="9" alt=""></div>
            <div class="crop-corner is-tr"><img data-src="img/result/crop-corner.svg" width="9" height="9" alt=""></div>
            <div class="crop-corner is-bl"><img data-src="img/result/crop-corner.svg" width="9" height="9" alt=""></div>
            <div class="crop-corner is-br"><img data-src="img/result/crop-corner.svg" width="9" height="9" alt=""></div>
            <div class="crop-points" id="lensResultPoints" data-dot="img/result/dot.svg"></div> <!-- 파형 점: 상품마다 하나, js/result.js가 만듦 -->
          </section>

          <section class="lens-result-sheet" aria-label="비슷한 상품">
            <div class="lens-result-handle" aria-hidden="true"></div>
            <div class="lens-result-title">
              <img class="lens-result-title-icon ai-icon" data-src="img/result/ic-ai.svg" width="18" height="18" alt=""> <!-- IconAI: 결과 화면이 나올 때 등장 → 루프 (css/result.css .ai-icon, js/result.js) -->

            </div>

              <div class="lens-result-thumbs" id="lensResultThumbs" role="tablist" aria-label="찾은 상품"></div>
              <img class="lens-result-sorting" data-src="img/result/sorting.png" width="63" height="18" alt="전체 성별"> <!-- 전체 성별 + 화살표: 동작 없는 이미지 -->
            </div>
            <div class="lens-result-lists" id="lensResultLists"></div>
          </section>
        </div>

    </div>

  <!-- ════ AI 분석 결과 데이터 (실서비스에서는 AI 응답으로 받는 값) ════
       image: 사용자가 올린 사진
       items: 찾은 상품. box = 사진 안 상품 영역, point = 파형 점 자리 (없으면 box 가운데)
              좌표는 모두 사진 원본 기준 0~1 비율 (x·y = 왼쪽 위, w·h = 너비·높이) → 어떤 크기의 사진이 와도 같은 방식으로 계산
       thumb·list: 프로토타입용 썸네일·상품 리스트 이미지 (실서비스에서는 검색 결과로 그림)
       아래 값: 상의 box·하의/모자 point 는 Figma 인터랙션 가이드 2.0 결과 화면(11890:117373) 위치를 사진 비율로 바꾼 것, 하의·모자 box 는 사진에서 잰 값 -->
  <script type="application/json" id="lensResultData">
  {
    "image": "img/result/photo.webp",
    "items": [
      { "id": "top",    "name": "상의", "box": { "x": 0.2575, "y": 0.163,  "w": 0.485, "h": 0.38  },
        "thumb": "img/result/thumb-1.png", "list": "img/result/product-list-1.webp" },
      { "id": "bottom", "name": "하의", "box": { "x": 0.349,  "y": 0.503,  "w": 0.298, "h": 0.418 }, "point": { "x": 0.4975, "y": 0.72 },
        "thumb": "img/result/thumb-2.png", "list": "img/result/product-list-2.webp" },
      { "id": "cap",    "name": "모자", "box": { "x": 0.44,   "y": 0.0445, "w": 0.153, "h": 0.093 }, "point": { "x": 0.5225, "y": 0.0767 },
        "thumb": "img/result/thumb-3.png", "list": "img/result/product-list-3.webp" }
    ]
  }
  </script>
