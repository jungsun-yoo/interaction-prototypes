<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[앱바] 체크인 진입 모션</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <link rel="stylesheet" href="src/common/mds-motion.css?v=20261109-1" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* 기기 크기: 공유 틀(index.html)이 --phone-w·--phone-h를 읽어 프레임 크기를 맞춤 */
      --phone-w: 375px;
      --phone-h: 812px;
      --phone-radius: 32px;
      --status-bar-h: 45px;   /* 앱바 시작 y */
      --appbar-h: 52px;
      --store-bg: #1A1B1F;    /* 무신사 스토어 헤더색 */
      --store-icon: #fff;

      /* 이벤트 배지 등장 모션 */
      --checkin-badge-fade: 0.15;                                            /* 페이드인 (초, linear) */
      --checkin-badge-spring-stiffness: var(--mds-motion-spring-bouncy-stiffness); /* mds.spring.bouncy 322 */
      --checkin-badge-spring-damping: var(--mds-motion-spring-bouncy-damping);     /* mds.spring.bouncy 26 */
      --checkin-badge-delay: 1;    /* 최초 등장 전 딜레이 (초) */
      --checkin-badge-hold: 3;     /* 등장 완료 후 노출 유지 (초) */
      --checkin-badge-rest: 6;     /* 사라짐 완료 후 다시 등장까지 (초) */
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f0f0f0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui,
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    /* 1125×2436 (@3x) → 375×812 */
    .screen {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      overflow: hidden;
    }

    /* 데스크탑(마우스 기기): 폰 모서리 · 그림자 (공유 틀 5th와 같은 값) */
    @media (hover: hover) and (pointer: fine) {
      .screen {
        border-radius: var(--phone-radius);
        box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 24px;
      }
    }

    .screen__bg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ─────────────────────────────
        AppBar — 무신사 스토어 (y 45, 375 × 52)
        출처: 26-1105 앱테크진입점모션 prototypes/Type_1.html
    ───────────────────────────── */
    .appbar {
      position: absolute;
      top: var(--status-bar-h);
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px; /* 로고 묶음과 아이콘 사이 최소 간격 */
      width: 100%;
      height: var(--appbar-h);
      padding: 0 16px;
      background: var(--store-bg);
    }

    .appbar-brand {
      display: flex;
      align-items: center;
      flex: 0 1 auto;
      min-width: 0;
    }

    .appbar-logo {
      display: flex;
      align-items: center;
      flex: 0 1 auto;
      min-width: 0;
    }

    .appbar-logo img {
      display: block;
      height: 20px;
      object-fit: contain;
    }

    /* 게이트웨이 버튼 로티: 로고 오른쪽에 갭 없이 */
    .appbar-gateway {
      flex: none;
      width: 28px;
      height: 24px;
    }

    .appbar-gateway svg {
      display: block;
    }

    .appbar-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      color: var(--store-icon);
    }

    .appbar-icon {
      position: relative;
      width: 28px;
      height: 28px;
    }

    .appbar-icon svg {
      display: block;
    }

    /* 체크인 아이콘 (Figma 221:72905)
       핀: 28 박스 안 22×24 프레임(3, 2) 기준 inset 4.95% / 12.86% → (5.83, 3.19) */
    .appbar-checkin-pin {
      position: absolute;
      top: 3.19px;
      left: 5.83px;
      display: block;
    }

    /* "이벤트" 배지: 아이콘 기준 (15, -2), 27 × 13. 모션은 이 요소에 붙일 예정 */
    .appbar-checkin-badge {
      position: absolute;
      top: -2px;
      left: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 13px;
      padding: 1.5px 3px;
      border-radius: 18px;
      background: #245EFF;
      color: #fff;
      font-size: 8px;
      font-weight: 500; /* Pretendard Medium */
      line-height: normal;
      white-space: nowrap;
      transform-origin: left bottom; /* 스케일 중심점: 좌하단 */
      opacity: 0;                    /* 등장 전 상태 (모션 시작 전 깜빡임 방지) */
      transform: scale(0);
    }

  </style>
</head>
<body>
  <main class="screen">
    <img class="screen__bg" src="src/page.png" alt="" />

    <header class="appbar">
      <div class="appbar-brand">
        <div class="appbar-logo">
          <img src="src/img/appbar/logo_front_musinsa.svg" alt="MUSINSA" width="81" height="20" />
        </div>
        <div class="appbar-gateway" id="appbarGateway" aria-hidden="true"></div>
      </div>

      <div class="appbar-icons">
        <!-- 체크인: 핀 아이콘 + "이벤트" 배지 (Figma 221:72905). 배지는 모션용으로 따로 둠 -->
        <div class="appbar-icon appbar-icon--checkin">
          <img class="appbar-checkin-pin" src="src/img/appbar/ic_checkin_pin.svg" alt="체크인" width="16.1721" height="22.5613" />
          <span class="appbar-checkin-badge" id="checkinBadge">이벤트</span>
        </div>
        <div class="appbar-icon appbar-icon--reward">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M19.3333 10.15L16.4707 18.8722C16.4678 18.881 16.4554 18.881 16.4525 18.8722L14.0091 11.3114C14.0062 11.3026 13.9938 11.3026 13.9909 11.3114L11.5475 18.8722C11.5446 18.881 11.5322 18.881 11.5293 18.8722L8.66667 10.15M10 14.3028H7M21 14.3028H18" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="14" cy="14" r="9.8" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </div>
        <div class="appbar-icon appbar-icon--alarm">
          <svg width="28" height="28" viewBox="36 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M54.2 19.6C54.2 21.9196 52.3196 23.8 50 23.8C47.6804 23.8 45.8 21.9196 45.8 19.6M43 11.2C43 7.33402 46.134 4.20001 50 4.20001C53.866 4.20001 57 7.33402 57 11.2V16.52C57 17.4363 58.2289 18.3482 59.2303 18.9391C59.5101 19.1042 59.3927 19.6 59.0678 19.6H40.9322C40.6073 19.6 40.4899 19.1042 40.7697 18.9391C41.7711 18.3482 43 17.4363 43 16.52V11.2Z" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </div>
        <div class="appbar-icon appbar-icon--cart">
          <svg width="28" height="28" viewBox="72 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M82.5 10.5V7.70001C82.5 5.76702 84.067 4.20001 86 4.20001C87.933 4.20001 89.5 5.76702 89.5 7.70001V10.5M94.4 10.8V22.8C94.4 22.9657 94.2657 23.1 94.1 23.1H77.9C77.7343 23.1 77.6 22.9657 77.6 22.8V10.8C77.6 10.6343 77.7343 10.5 77.9 10.5H94.1C94.2657 10.5 94.4 10.6343 94.4 10.8Z" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </div>
      </div>
    </header>
  </main>


  <script src="src/lib/lottie_svg-5.13.0.min.js?v=20261109-1"></script>
  <script src="src/lib/motion-14.1.0.js?v=20261109-1"></script>
  <script>
    /* 게이트웨이 버튼 로티: 자동재생 · 무한루프 */
    (function () {
      var container = document.getElementById('appbarGateway');
      if (!container || !window.lottie) return;
      lottie.loadAnimation({
        container: container,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'src/lottie/ic_gateway_affordance.json'
      });
    })();

    /* 이벤트 배지 루프 (중심점 좌하단)
       등장: 페이드인 0.15s linear + 스케일 0 → 1 (mds.spring.bouncy)
       퇴장: 같은 이징으로 반대로 (페이드아웃 + 스케일 1 → 0 동시 시작)
       최초 1초 딜레이 → 등장 완료 → 3초 노출 → 퇴장 완료 → 6초 대기 → 다시 등장 … 무한 반복
       페이지 로드 시 시작, 체크인 아이콘을 누르면 처음(딜레이)부터 다시
       값은 매 단계마다 CSS 변수에서 다시 읽으므로 공유 틀(index.html) 컨트롤 패널 변경이 다음 단계부터 바로 반영됨 */
    (function () {
      var badge = document.getElementById('checkinBadge');
      var checkin = document.querySelector('.appbar-icon--checkin');
      if (!badge || !window.Motion) return;
      var current = null; /* 진행 중인 모션 */
      var timer = null;   /* 대기 타이머 */
      var runId = 0;      /* 루프 재시작 시 이전 루프 중단용 */

      function cssNumber(name) {
        return parseFloat(getComputedStyle(badge).getPropertyValue(name));
      }

      /* from → to 로 페이드(linear) + 스케일(spring) 동시 진행 */
      function animateBadge(from, to) {
        current = Motion.animate(badge, { opacity: [from, to], scale: [from, to] }, {
          opacity: { duration: cssNumber('--checkin-badge-fade'), ease: 'linear' },
          scale: {
            type: 'spring',
            stiffness: cssNumber('--checkin-badge-spring-stiffness'),
            damping: cssNumber('--checkin-badge-spring-damping')
          }
        });
        return current.finished;
      }

      function wait(seconds) {
        return new Promise(function (resolve) { timer = setTimeout(resolve, seconds * 1000); });
      }

      async function loop() {
        var id = ++runId;
        await wait(cssNumber('--checkin-badge-delay'));  /* 최초 딜레이 */
        while (id === runId) {
          await animateBadge(0, 1);                  /* 등장 */
          if (id !== runId) return;
          await wait(cssNumber('--checkin-badge-hold'));
          if (id !== runId) return;
          await animateBadge(1, 0);                  /* 퇴장 */
          if (id !== runId) return;
          await wait(cssNumber('--checkin-badge-rest'));
        }
      }

      function restart() {
        runId++;
        clearTimeout(timer);
        if (current) current.stop();
        Motion.animate(badge, { opacity: 0, scale: 0 }, { duration: 0 }); /* 숨긴 상태에서 다시 시작 */
        loop();
      }

      window.playCheckinBadge = restart;
      checkin.addEventListener('click', restart);
      document.fonts.ready.then(restart); /* 폰트 적용 후 시작해 배지 폭이 바뀌지 않게 */
    })();

  </script>
</body>
</html>
