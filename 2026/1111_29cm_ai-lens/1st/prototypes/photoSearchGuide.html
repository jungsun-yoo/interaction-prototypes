<!DOCTYPE html>
<html lang="ko"> <!-- 폰 크기: 390×844 고정 (배경 이미지 780×1688 @2x 기준, 아래 <style>에서 지정) -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>사진 검색 가이드</title>
  <!-- 홈 화면 아이콘으로 열면 사파리 없이 전체 화면 (링크로 열면 기존처럼 사파리) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="사진 검색 가이드"> <!-- 홈 화면에 추가 기본 이름: common.js가 인덱스 CONFIG.title로 바꿈 -->
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css"> <!-- 폰트: Pretendard (무신사 CDN) -->
  <link rel="stylesheet" href="./src/common/mds-motion.css?v=20261113-57">
  <link rel="stylesheet" href="./src/common/common.css?v=20261113-57">
  <link rel="stylesheet" href="./src/components/ProtoSpec/proto-spec.css?v=20261113-57"> <!-- 폰 오른쪽 개발 전달용 설명창 -->
  <style>
    /* ════════════════════════════════════════════════════
       화면 스타일 — 사진 검색 가이드 (화면 이미지 + 가이드 로티)
       배경 tutorial.png(780×1688 @2x)에 상태바·바텀시트까지 그려져 있어 390×844로 고정
       ════════════════════════════════════════════════════ */

    :root {
      /* 폰 크기: 폰 화면 390×844 + 오른쪽 설명창 (index가 --phone-w·--phone-h를 읽어 프레임을 맞추고, 툴바는 --phone-screen-w 오른쪽에 붙임) */
      --phone-screen-w: 390px;
      --phone-w: 682px;   /* 폰 390 + 간격 12 + 설명창 280 (index가 숫자로 읽어서 calc 대신 값으로 적음) */
      --phone-h: 844px;
      --phone-radius: 0px;
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    /* 폰 틀(.phone)은 폰 화면 + 설명창을 담는 투명 상자 (proto-spec.css). 폰 화면은 390×844 고정 */
    .phone {
      width: var(--phone-w);
      min-width: 0;
      max-width: var(--phone-w);
      height: var(--phone-h);
    }
    .proto-screen {background: #fff;}
    .phone-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ---------- 가이드 로티 (이미지 카드 자리 358×286, x16 y426, 모서리 4px) ---------- */
    .guide-lottie {
      position: absolute;
      left: 16px;
      top: 426px;
      width: 358px;
      height: 286px;
      border-radius: 4px;
      overflow: hidden;
    }
    .guide-lottie svg {display: block;}
  </style>
</head>
<body>

  <!-- 상태바 요소 없음: 배경 tutorial.png(780×1688 @2x)에 상태바·바텀시트까지 그려져 있음 -->
  <main class="phone has-spec">
   <div class="proto-layout">
    <div class="proto-screen">
    <img class="phone-bg" src="src/img/tutorial.png" alt="">

    <!-- 가이드 로티: tutorial_lens.json (1074×858 → 358×286, 바텀시트 안 이미지 카드 자리 x16 y426) -->
    <div class="guide-lottie" id="guideLottie" aria-hidden="true"></div>
    </div>

    <!-- 개발 전달용 설명창 (폰 오른쪽, index 툴바 아래) -->
    <aside class="proto-spec" aria-label="개발 전달 사항">
      <p class="proto-spec-title">사진 검색 가이드</p>
      <div class="proto-spec-files">
        <a class="proto-spec-file" href="src/img/tutorial_lens.json" download="tutorial_lens.json">tutorial_lens 다운로드</a>
      </div>

      <h3>재생 방식</h3>
      <ol>
        <li>화면 진입과 함께 <code>tutorial_lens</code> 재생</li>
        <li>처음부터 끝까지 <strong>무한 반복</strong> (한 번에 약 7초)</li>
      </ol>
      <p class="proto-spec-note">로티 안에 이미지 7장(WebP)이 들어 있어 파일 하나로 재생돼요.</p>
    </aside>
   </div>
  </main>

  <!-- 라이브러리: 필요할 때만 CDN으로 붙임 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie_svg.min.js"></script>
  <script src="./src/common/common.js?v=20261113-57"></script>
  <script>
    /* 화면 동작 — 사진 검색 가이드
       로티: 화면 진입과 함께 tutorial_lens.json 재생, 무한 반복
       index 다시 재생(R)으로 처음부터 */
    (function () {
        var box = document.getElementById('guideLottie');
        if (!box || !window.lottie) return;

        lottie.loadAnimation({
            container: box,
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'src/img/tutorial_lens.json?t=' + Date.now() /* 로티를 다시 내보내도 바로 반영되게 캐시 방지 */
        });
    })();
  </script>
</body>
</html>
