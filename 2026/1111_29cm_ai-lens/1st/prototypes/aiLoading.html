<!DOCTYPE html>
<html lang="ko"> <!-- 폰 크기: 390×844 고정 (아래 <style>에서 지정) -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>AI 로딩 아이콘</title>
  <!-- 홈 화면 아이콘으로 열면 사파리 없이 전체 화면 (링크로 열면 기존처럼 사파리) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI 로딩 아이콘"> <!-- 홈 화면에 추가 기본 이름: common.js가 인덱스 CONFIG.title로 바꿈 -->
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css"> <!-- 폰트: Pretendard (무신사 CDN) -->
  <link rel="stylesheet" href="./src/common/mds-motion.css?v=20261113-61">
  <link rel="stylesheet" href="./src/common/common.css?v=20261113-61">
  <!-- AI 로딩 아이콘 원본 (MusinsaStore/AIEffect/IconAILoading 복사본 — 원본이 바뀌면 이 폴더째 덮어쓰기) -->
  <link rel="stylesheet" href="./src/components/IconAILoading/img-css/icon-ai-loading-img.css?v=20261113-61">
  <link rel="stylesheet" href="./src/components/ProtoSpec/proto-spec.css?v=20261113-61"> <!-- 폰 오른쪽 개발 전달용 설명창 -->
  <style>
    /* ════════════════════════════════════════════════════
       화면 스타일 — AI 로딩 아이콘 (빈 화면 가운데, 로티 원본 vs IMG 방식 비교)
       아이콘 모션 자체는 src/components/IconAILoading/ 의 원본 CSS가 담당.
       여기서는 폰 크기와 비교 배치만 정함
       ════════════════════════════════════════════════════ */

    :root {
      /* 폰 크기: 폰 화면 390×844 + 오른쪽 설명창 (index가 --phone-w·--phone-h를 읽어 프레임을 맞추고, 툴바는 --phone-screen-w 오른쪽에 붙임) */
      --phone-screen-w: 390px;
      --phone-w: 682px;   /* 폰 390 + 간격 12 + 설명창 280 (index가 숫자로 읽어서 calc 대신 값으로 적음) */
      --phone-h: 844px;
      --phone-radius: 0px;

      /* 아이콘 크기와 재생 시간 (원본 기준: 32px, 로티 108f @60fps = 1.8s) */
      --IconAILoading-size: 32px;
      --IconAILoading-time: 1.8s;
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    /* 폰 틀(.phone)은 폰 화면 + 설명창을 담는 투명 상자 (proto-spec.css) */
    .phone {
      width: var(--phone-w);
      min-width: 0;
      max-width: var(--phone-w);
      height: var(--phone-h);
    }
    .proto-screen {background: #fff;}

    /* ---------- 비교 배치: 세로로 2개, 화면 가운데 ---------- */
    .loading-compare {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 56px;
    }
    .loading-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 아이콘 자리: 원본 CSS가 .IconAILoading 을 부모 가운데(absolute 50%)에 놓으므로 기준 상자를 둠 */
    .loading-stage {
      position: relative;
      width: var(--IconAILoading-size);
      height: var(--IconAILoading-size);
    }
    .IconAILoading-lottie {
      display: block;
      width: 100%;
      height: 100%;
    }
    .IconAILoading-lottie svg {display: block;}

    .loading-label {
      margin: 0;
      color: #999;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
    }
  </style>
</head>
<body>

  <!-- 빈 화면 가운데에 로티 원본과 IMG 방식을 비교 (SVG Inline은 매 프레임 다시 그려 튀는 문제로 제외) -->
  <main class="phone has-spec">
   <div class="proto-layout">
    <div class="proto-screen">
    <section class="loading-compare" aria-label="AI 로딩 아이콘 구현 방식 비교">

      <!-- 1. 로티 원본: lottie/IconAILoading.json (아래 <script>에서 재생) -->
      <div class="loading-row">
        <div class="loading-stage">
          <div class="IconAILoading-lottie" id="aiLoadingLottie" role="img" aria-label="AI 로딩"></div>
        </div>
        <p class="loading-label">Lottie Animation</p>
      </div>


      <!-- 2. IMG + CSS: img-css/IconAI.svg 4장을 CSS로 움직임 -->
      <div class="loading-row">
        <div class="loading-stage">
          <div class="IconAILoading is-playing" role="img" aria-label="AI 로딩">
            <span><img src="./src/components/IconAILoading/img-css/IconAI.svg" alt=""></span>
            <span><img src="./src/components/IconAILoading/img-css/IconAI.svg" alt=""></span>
            <span><img src="./src/components/IconAILoading/img-css/IconAI.svg" alt=""></span>
            <span><img src="./src/components/IconAILoading/img-css/IconAI.svg" alt=""></span>
          </div>
        </div>
        <p class="loading-label">IMG CSS Animation</p>
      </div>

    </section>
    </div>

    <!-- 개발 전달용 설명창 (폰 오른쪽, index 툴바 아래) -->
    <aside class="proto-spec" aria-label="개발 전달 사항">
      <p class="proto-spec-title">AI 로딩 아이콘</p>
      <div class="proto-spec-files">
        <a class="proto-spec-file" href="src/components/IconAILoading/lottie/IconAILoading.json" download="IconAILoading.json">lottie 다운로드</a>
        <a class="proto-spec-file" href="../download/IconAILoading-img-css.zip" download="IconAILoading-img-css.zip">CSS 다운로드</a>
      </div>

      <h3>재생 방식</h3>
      <ol>
        <li><strong>로티</strong>(<code>IconAILoading.json</code>) 또는 <strong>IMG CSS Animation</strong> 중 개발 편의에 맞춰 하나를 골라 진행</li>
        <li>둘 다 같은 모션, 1.8초 주기 <strong>무한 반복</strong></li>
      </ol>
    </aside>
   </div>
  </main>

  <!-- 라이브러리: 필요할 때만 CDN으로 붙임 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie_svg.min.js"></script>
  <script src="./src/common/common.js?v=20261113-61"></script>
  <script>
    /* 화면 동작 — AI 로딩 아이콘
       로티 원본만 JS로 재생 (무한 반복). IMG 는 원본 CSS의 is-playing 으로 재생
       index 다시 재생(R)으로 처음부터 */
    (function () {
        var box = document.getElementById('aiLoadingLottie');
        if (!box || !window.lottie) return;

        lottie.loadAnimation({
            container: box,
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'src/components/IconAILoading/lottie/IconAILoading.json?t=' + Date.now() /* 캐시 방지 */
        });
    })();
  </script>
</body>
</html>
