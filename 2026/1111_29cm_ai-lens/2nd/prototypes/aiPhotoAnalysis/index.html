<!DOCTYPE html>
<html lang="ko" data-index-path="../../index.html"> <!-- AI 사진 분석: 29CM 로딩 → 결과 화면 + 옆 옵션창. 이 폴더가 AI 사진 분석 전부 (조절 값은 css/values.css, 명세는 interaction.md) -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>AI 사진 분석</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI 사진 분석"> <!-- 홈 화면에 추가 기본 이름: common.js가 인덱스 CONFIG.title로 바꿈 -->
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css"> <!-- 폰트: Pretendard (무신사 CDN) -->
  <link rel="stylesheet" href="../src/common/mds-motion.css?v=20261118-2">
  <link rel="stylesheet" href="../src/common/common.css?v=20261118-2">
  <!-- 가운데 AI 아이콘: AI 로딩 아이콘과 같은 IMG CSS Animation -->
  <link rel="stylesheet" href="../src/components/IconAILoading/img-css/icon-ai-loading-img.css?v=20261118-2">
  <!-- AI 사진 분석 (이 폴더) -->
  <link rel="stylesheet" href="./css/values.css?v=20261118-2">    <!-- 조절 값: 수치는 여기서 -->
  <link rel="stylesheet" href="./css/loading.css?v=20261118-2">   <!-- 로딩 화면 -->
  <link rel="stylesheet" href="./css/result.css?v=20261118-2">    <!-- 결과 화면 -->
  <link rel="stylesheet" href="./css/layout.css?v=20261118-2">    <!-- 화면 배치 · 휴대폰 -->
  <link rel="stylesheet" href="./css/controls.css?v=20261118-2">  <!-- 옵션창 -->
</head>
<body>

  <!-- 29CM 로딩 중 → (분석 시간 뒤 자동 · [로딩 완료]) → 29CM 분석 결과 · 옆에 옵션창 -->
  <div class="phone">
    <div class="lens-pair">
      <!-- 로딩 화면 (390×844): css/loading.css -->
      <figure class="lens-device" id="lensLoadingScreen">
        <div class="lens-screen" aria-label="29CM AI 사진 분석 중">
          <img class="lens-status" src="img/shared/status-bar.png" width="390" height="50" alt="">
          <section class="Content" aria-label="사진 분석">
            <div class="ImageVertical">
              <div class="Image"><img src="img/loading/photo.webp" width="750" height="1000" alt="분석 중인 사진"></div>
              <div class="Dim" aria-hidden="true"></div>
            </div>
            <div class="AILoading">
              <!-- 빛(Light): 원형 창이 사진 위를 떠다니며 지나가는 자리만 원본 사진이 밝게 비침. 가로·세로를 따로 움직여 곡선으로 훑음 (모두 transform) -->
              <div class="LensLight" aria-hidden="true"><div class="LensLightX"><div class="LensLightY">
                <div class="LensLightMask"><div class="LensLightMaskY"><div class="LensLightMaskX"><div class="Image LensLightImage"><img src="img/loading/photo.webp" width="750" height="1000" alt=""></div></div></div></div>
                <div class="LensOrb"></div> <!-- 빛 구체: 밝힘 마스크 위 펄 톤 빛 (같은 중심으로 같이 움직임) -->
              </div></div></div>
              <div class="IconAIContainer" role="status">
                <div class="IconAI" aria-hidden="true">
                  <div class="IconAILoading is-playing"> <!-- IconAI.svg 4장을 icon-ai-loading-img.css로 움직임 (AI 로딩 아이콘과 같은 방식) -->
                    <span><img src="../src/components/IconAILoading/img-css/IconAI.svg" width="32" height="32" alt=""></span>
                    <span><img src="../src/components/IconAILoading/img-css/IconAI.svg" width="32" height="32" alt=""></span>
                    <span><img src="../src/components/IconAILoading/img-css/IconAI.svg" width="32" height="32" alt=""></span>
                    <span><img src="../src/components/IconAILoading/img-css/IconAI.svg" width="32" height="32" alt=""></span>
                  </div>
                </div>
                <div class="LoadingMsg"><p data-text="AI가 사진을 분석중입니다">AI가 사진을 분석중입니다</p></div>
              </div>
            </div>
          </section>
          <header class="AppBar" aria-label="29CM 렌즈 앱바">
            <div class="LeftItem"><img src="img/shared/appbar-l.png" width="60" height="60" alt="뒤로"></div>
            <div class="CenterItem"><img src="img/shared/appbar-c.png" width="110" height="60" alt="29CM 렌즈"></div>
            <div class="RightItem"><img src="img/shared/appbar-r.png" width="60" height="60" alt="렌즈 스캔"></div>
          </header>
        </div>
      </figure>
      <!-- 결과 화면 (390×844): css/result.css. 처음엔 숨김 → 로딩이 끝나면 로딩 화면 대신 보이고 바텀시트가 아래에서 올라옴 (js/flow.js) -->
      <figure class="lens-device" id="lensResultScreen" hidden>
        <div class="lens-result is-sheet-down" id="lensResult" aria-label="29CM AI 사진 분석 결과">
          <img class="lens-result-status" src="img/shared/status-bar.png" width="390" height="50" alt="">
          <header class="lens-result-nav" aria-label="29CM 렌즈 앱바">
            <div class="LeftItem"><img src="img/shared/appbar-l.png" width="60" height="60" alt="뒤로"></div>
            <div class="CenterItem"><img src="img/shared/appbar-c.png" width="110" height="60" alt="29CM 렌즈"></div>
            <div class="RightItem"><img src="img/shared/appbar-r.png" width="60" height="60" alt="렌즈 스캔"></div>
            <img class="lens-result-share" src="img/result/ic-share.svg" width="24" height="24" alt="공유">
          </header>

          <!-- 사진 위 표시(밝은 창·모서리·파형 점) 위치는 아래 lensResultData 의 비율 좌표로 js/result.js가 계산함 -->
          <section class="lens-result-photo" id="lensResultPhoto" aria-label="검색한 사진">
            <img class="crop-photo" alt="검색한 사진">
            <div class="crop-dim" aria-hidden="true"></div>
            <img class="crop-photo crop-reveal" alt=""> <!-- 밝은 창: clip-path로 잘라 이동 -->
            <div class="crop-corner is-tr"><img src="img/result/crop-corner-tr.svg" width="11" height="11" alt=""></div>
            <div class="crop-corner is-bl"><img src="img/result/crop-corner-bl.svg" width="11" height="11" alt=""></div>
            <div class="crop-points" id="lensResultPoints" data-dot="img/result/dot.svg"></div> <!-- 파형 점: 상품마다 하나, js/result.js가 만듦 -->
          </section>

          <section class="lens-result-sheet" aria-label="비슷한 상품">
            <div class="lens-result-handle" aria-hidden="true"></div>
            <img class="lens-result-title" src="img/result/sheet-title.png" width="390" height="46" alt="AI가 사진과 비슷한 상품을 찾았어요 · 다른 사진 검색">
            <!-- 썸네일·상품 리스트: lensResultData 의 상품마다 하나씩 js/result.js가 만듦 -->
            <div class="lens-result-thumbs" id="lensResultThumbs" role="tablist" aria-label="찾은 상품"></div>
            <div class="lens-result-lists" id="lensResultLists"></div>
          </section>
        </div>
      </figure>

      <!-- 옵션창 (PC에서 폰 옆, 휴대폰에서는 숨김): css/controls.css · js/flow.js -->
      <div class="lens-controls">
      <!-- 개발 전달: 다른 프로토타입 설명창과 같은 검정 다운로드 버튼. 압축(pack.py로 만듦) = 이 프로토타입 + 명세 interaction.md, 압축 안에는 옵션창이 빠짐 -->
      <aside class="lens-control" aria-label="개발 전달">
        <p class="lens-control-title">AI 사진 분석</p>
        <a class="lens-control-file" href="../../download/aiPhotoAnalysis.zip" download="aiPhotoAnalysis.zip">프로토타입 다운로드</a>
        <p class="lens-control-download-note">압축 파일 안의 <strong>interaction.md</strong>를 확인해 주세요.</p>
      </aside>
      <aside class="lens-control" aria-label="옵션 컨트롤"> <!-- 디자인: 공유 틀 오른쪽 카드와 같음 (css/controls.css) -->
        <p class="lens-control-title">AI 사진 분석</p>
        <div class="lens-control-row"><span class="lens-control-label">상태</span><span class="lens-control-value" id="lensState">로딩 중</span></div>
        <!-- 로딩만 보기 (기본 끔): 켜면 분석 시간·[로딩 완료]를 끄고 로딩 화면만 계속 ([다시 로딩]만 사용) -->
        <label class="lens-control-row"><span class="lens-control-label">로딩만 보기</span><input class="lens-control-switch" type="checkbox" id="lensLoadingOnly"></label>
        <!-- 분석 시간: 이 시간이 지나면 자동으로 로딩 완료 (1~10초, 기본 6초. 슬라이더 · ▲▼ 0.5초 단위, 숫자 칸 직접 입력도 가능) -->
        <div class="lens-control-row is-slider" id="lensDurationField">
          <span class="lens-control-label">분석 시간</span>
          <div class="lens-control-slider-line">
            <input class="lens-control-range" id="lensDurationRange" type="range" min="1" max="10" step="0.5" value="6" aria-label="분석 시간 (초)">
            <span class="lens-control-number">
              <label class="lens-control-field"><input id="lensDurationInput" type="number" min="1" max="10" step="0.5" value="6" inputmode="decimal" aria-label="분석 시간 (초)"><span class="lens-control-unit">초</span></label>
              <span class="lens-control-step"><button type="button" data-step="1" aria-label="올리기"></button><button type="button" data-step="-1" aria-label="내리기"></button></span>
            </span>
          </div>
        </div>
        <div class="lens-control-actions">
          <button class="lens-control-btn is-primary" id="lensComplete" type="button">로딩 완료</button>
          <button class="lens-control-btn" id="lensRestart" type="button">다시 로딩</button>
        </div>
      </aside>
      </div>
    </div>
  </div>


  <!-- ════ AI 분석 결과 데이터 (실서비스에서는 AI 응답으로 받는 값) ════
       image: 사용자가 올린 사진
       items: 찾은 상품. box = 사진 안 상품 영역, point = 파형 점 자리 (없으면 box 가운데)
              좌표는 모두 사진 원본 기준 0~1 비율 (x·y = 왼쪽 위, w·h = 너비·높이) → 어떤 크기의 사진이 와도 같은 방식으로 계산
       thumb·list: 프로토타입용 썸네일·상품 리스트 이미지 (실서비스에서는 검색 결과로 그림)
       아래 값은 Figma 29Lens 3화면(241:59837 / 59871 / 59905)의 위치를 이 사진 기준 비율로 바꾼 것 -->
  <script type="application/json" id="lensResultData">
  {
    "image": "img/result/photo-crop.webp",
    "items": [
      { "id": "top",    "name": "상의", "box": { "x": 0.2953, "y": 0.2821, "w": 0.4523, "h": 0.425  }, "point": { "x": 0.5667, "y": 0.3893 },
        "thumb": "img/result/thumb-1.png", "list": "img/result/product-list-1.webp" },
      { "id": "bottom", "name": "하의", "box": { "x": 0.2667, "y": 0.6607, "w": 0.3952, "h": 0.2464 }, "point": { "x": 0.4667, "y": 0.8107 },
        "thumb": "img/result/thumb-2.png", "list": "img/result/product-list-2.webp" },
      { "id": "bag",    "name": "가방", "box": { "x": 0.2048, "y": 0.2679, "w": 0.2761, "h": 0.4929 }, "point": { "x": 0.2333, "y": 0.5929 },
        "thumb": "img/result/thumb-3.png", "list": "img/result/product-list-3.webp" }
    ]
  }
  </script>
  <script src="../src/common/common.js?v=20261118-2"></script>
  <!-- 순서대로: 결과 화면 → 로딩·결과 흐름 → QR·휴대폰 동기화 -->
  <script src="./js/result.js?v=20261118-2"></script>
  <script src="./js/flow.js?v=20261118-2"></script>
  <script src="./js/sync.js?v=20261118-2"></script>
</body>
</html>
