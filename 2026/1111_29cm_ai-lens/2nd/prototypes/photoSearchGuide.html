<!DOCTYPE html>
<html lang="ko" data-preload="src/img/tutorial_lens.json?v=20261124-3"> <!-- 폰 크기: 390×844 고정 (배경 이미지 780×1688 @2x 기준, 아래 <style>에서 지정) -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>사진 검색 가이드</title>
  <!-- 홈 화면 아이콘으로 열면 사파리 없이 전체 화면 (링크로 열면 기존처럼 사파리) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="사진 검색 가이드"> <!-- 홈 화면에 추가 기본 이름: common.js가 인덱스 CONFIG.title로 바꿈 -->
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css"> <!-- 폰트: Pretendard (무신사 CDN) -->
  <link rel="stylesheet" href="./src/common/mds-motion.css?v=20261124-3">
  <link rel="stylesheet" href="./src/common/common.css?v=20261124-3">
  <style>
    /* ════════════════════════════════════════════════════
       화면 스타일 — 사진 검색 가이드 (화면 이미지 + 가이드 로티)
       배경 tutorial.png(780×1688 @2x)에 상태바·바텀시트까지 그려져 있어 390×844로 고정
       ════════════════════════════════════════════════════ */

    :root {
      /* 폰 크기: 390×844 (index가 --phone-w·--phone-h를 읽어 프레임을 맞춤) · 모서리 48 (AI 사진 분석 화면과 같음). 개발 전달 파일 · 재생 방식은 인덱스 오른쪽 FILES · MOTION 카드 */
      --phone-w: 390px;
      --phone-h: 844px;
      --phone-radius: 48px;
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    .phone {background: #fff;}
    .phone-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ---------- 가이드 로티 (이미지 카드 자리 358×286, x16 y426, 모서리 4px) ---------- */
    .guide-lottie {
      position: absolute;
      left: 16px;
      top: 426px;
      width: 358px;
      height: 286px;
      border-radius: 4px;
      overflow: hidden;
    }
    .guide-lottie svg {display: block;}
  </style>
</head>
<body>

  <!-- 상태바 요소 없음: 배경 tutorial.png(780×1688 @2x)에 상태바·바텀시트까지 그려져 있음 -->
  <main class="phone">
    <img class="phone-bg" src="src/img/tutorial.png" alt="">

    <!-- 가이드 로티: tutorial_lens.json (1074×858 → 358×286, 바텀시트 안 이미지 카드 자리 x16 y426) -->
    <div class="guide-lottie" id="guideLottie" aria-hidden="true"></div>
  </main>

  <!-- 라이브러리: 필요할 때만 CDN으로 붙임 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie_svg.min.js"></script>
  <script src="./src/common/common.js?v=20261124-3"></script>
  <script>
    /* 화면 동작 — 사진 검색 가이드
       로티: 화면 진입과 함께 tutorial_lens.json 재생, 무한 반복
       index 다시 재생(R)으로 처음부터 */
    (function () {
        var box = document.getElementById('guideLottie');
        if (!box || !window.lottie) return;

        var anim = lottie.loadAnimation({
            container: box,
            renderer: 'svg',
            loop: true,
            autoplay: false,
            path: 'src/img/tutorial_lens.json?v=20261124-3' /* 페이지 로딩이 미리 받는 주소와 같게 (<html data-preload>) */
        });
        /* 로티 파일을 다 읽고 + 페이지 로딩이 끝나 화면이 보이면 재생 (common.js protoReady) */
        var loaded = new Promise(function (resolve) { anim.addEventListener('DOMLoaded', resolve); });
        Promise.all([loaded, window.protoReady || Promise.resolve()]).then(function () { anim.goToAndPlay(0, true); });
    })();
  </script>
</body>
</html>
