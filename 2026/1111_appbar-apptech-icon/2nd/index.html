<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype</title>
  <!-- 파비콘: 무신사 (CDN) -->
  <link rel="icon" type="image/svg+xml" href="https://image.msscdn.net/static/assets/bi/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="https://image.msscdn.net/static/assets/bi/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://image.msscdn.net/static/assets/bi/favicon/favicon-180x180.png">
  <link rel="stylesheet" href="https://static.msscdn.net/skin/musinsa/css/dsFont-1.5.css">
  <style>
    /* ════════════════════════════════════════════════════
        프로토타입 인덱스 (재사용: 아래 script의 CONFIG만 수정)
        PC 전용: 좌측 패널에서 항목 선택 → 가운데 iframe에 prototype(s)/*.html
       ════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --panel-w: 240px;
      --panel-bg: #1c1c1e;
      --panel-line: rgba(255, 255, 255, 0.08);
      --panel-text: #fff;
      --panel-sub: rgba(255, 255, 255, 0.45);
      --canvas-bg: #f0f0f0;
      /* 프레임(iframe) = 폰 + 그림자 여백×2
         --phone-w·--phone-h는 각 프로토타입 common.css 값을 script가 읽어 덮어씀 (아래는 불러오기 전 잠깐 쓰는 기본값) */
      --phone-w: 402px;
      --phone-h: 874px;
      --frame-pad: 32px;  /* 폰 그림자 여백 (한쪽) */
      --frame-w: calc(var(--phone-w) + var(--frame-pad) * 2);
      --frame-h: calc(var(--phone-h) + var(--frame-pad) * 2);
      --qr-card-w: 172px; /* QR 카드 (QR 140 + 여백 16×2) */
      --qr-mini-w: 112px; /* 작은 QR 카드 (QR 96 + 여백 8×2) */
    }

    html, body {
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; /* Pretendard 우선, 없으면 Apple 시스템 폰트(SF Pro·Apple SD Gothic Neo) */
      background: var(--canvas-bg);
    }
    .layout { display: grid; grid-template-columns: var(--panel-w) 1fr; height: 100%;}

    /* --- 좌측 패널 --- */
    .panel {display: flex; flex-direction: column; background: var(--panel-bg); color: var(--panel-text);}
    .panel-head {padding: 24px 20px 20px; border-bottom: 1px solid var(--panel-line);}
    .panel-title { font-size: 18px; font-weight: 700; line-height: 24px; }
    .panel-sub { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--panel-sub); }
    /* 외부 링크 칩(Figma·Jira): 제목 아래 가로 배치, 선택한 항목의 주소로 이동
       Figma·Jira 모두 주소가 없으면 비활성(딤드) */
    .panel-links {display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;}
    .panel-link {display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 12px; font-weight: 600; line-height: 16px; text-decoration: none;}
    .panel-link:hover {background: rgba(255, 255, 255, 0.16);}
    .panel-link svg {flex-shrink: 0; display: block;}
    .panel-link-arrow {color: var(--panel-sub); font-weight: 400;}
    .panel-link.is-disabled {opacity: 0.35; pointer-events: none;}
    /* 다운로드 버튼: 패널 머리 아래, TYPES 제목 위 한 줄 전체. 파일이 없으면 숨김 */
    .panel-download-wrap {padding: 16px 20px 0;}
    .panel-download {display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 36px; border-radius: 6px; background: #fff; color: #000; font-size: 13px; font-weight: 700; line-height: 16px; text-decoration: none;}
    .panel-download svg {flex-shrink: 0; display: block;}
    .panel-download:hover {background: rgba(255, 255, 255, 0.85);}
    .panel-download + .panel-download {margin-top: 6px;}
    /* 숨김: 버튼 각각, 둘 다 숨으면 묶음(위 여백)까지 */
    .panel-download.is-hidden, .panel-download-wrap:not(:has(.panel-download:not(.is-hidden))) {display: none;}

    .panel [hidden] {display: none;} /* 타입 1개일 때 목록 숨김 (display: flex보다 우선) */
    .panel-label {padding: 20px 20px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--panel-sub);}
    .type-list { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; list-style: none; }
    .type-button {display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: rgba(255, 255, 255, 0.75); font: inherit; font-size: 14px; line-height: 20px; text-align: left; text-decoration: none; cursor: pointer;}
    .type-button:hover { background: rgba(255, 255, 255, 0.05); }
    .type-button.is-active { background: rgba(255, 255, 255, 0.12); color: #fff; font-weight: 600; }

    .panel-foot {margin-top: auto; padding: 16px; border-top: 1px solid var(--panel-line);}
    .panel-hint {font-size: 11px; line-height: 16px; color: var(--panel-sub); text-align: center; }

    /* 가운데: 폰 프레임 iframe. 화면 높이·너비가 모자라면 비율 유지하며 축소 (script) */
    .stage {position: relative; overflow: hidden;}
    /* QR 카드: 가운데 바탕 좌상단. 선택한 항목 주소를 폰으로 열기
       폰 왼쪽 여백이 줄면 단계적으로: 전체 카드 → .is-mini (QR만) → .is-folded (툴바 QR 버튼, 누르면 툴바 옆 팝오버 .is-open) */
    .qr-card {position: absolute; top: 24px; left: 24px; z-index: 1; width: var(--qr-card-w); padding: 16px; border-radius: 16px; background: #fff; box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 24px;}
    .qr-card.is-mini {width: var(--qr-mini-w); padding: 8px; border-radius: 12px;}
    .qr-card.is-mini .qr-title, .qr-card.is-mini .qr-url {display: none;}
    .qr-card.is-folded {display: none; z-index: 2;}
    .qr-card.is-folded.is-open {display: block;}
    .qr-image {display: block; width: 100%; aspect-ratio: 1;}
    .qr-image[href] {cursor: pointer; transition: opacity 0.15s linear;}
    .qr-image[href]:hover {opacity: 0.7;}
    .qr-image svg {display: block; width: 100%; height: 100%;}
    .qr-title {margin-top: 12px; font-size: 13px; font-weight: 600; line-height: 18px; color: #000;}
    .qr-url {margin-top: 2px; font-size: 11px; line-height: 15px; color: rgba(0, 0, 0, 0.45); word-break: break-all;}
    .qr-empty {font-size: 12px; line-height: 17px; color: rgba(0, 0, 0, 0.6);}
    /* 제어 툴바: 폰 오른쪽에 붙음 (위치는 script fitFrame). 폰 오른쪽 여백이 모자라면 바탕 우상단(.is-corner) */
    .stage-tools {position: absolute; top: 24px; right: 24px; z-index: 1; display: flex; flex-direction: column; gap: 4px; padding: 4px; border-radius: 12px; background: #fff; box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 24px;}
    .stage-tools.is-attached {right: auto;}
    .tool-button {position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #000; cursor: pointer;}
    .tool-button:hover {background: rgba(0, 0, 0, 0.06);}
    .tool-button svg {display: block;}
    .tool-button[hidden] {display: none;}
    .qr-card.is-open ~ .stage-tools #qrButton {background: rgba(0, 0, 0, 0.06);}
    /* 툴팁: 붙어 있을 땐 오른쪽, 우상단일 땐 왼쪽(폰 쪽)으로 */
    .tool-button::after {content: attr(data-tip); position: absolute; top: 50%; left: calc(100% + 10px); padding: 6px 8px; border-radius: 6px; background: #1c1c1e; color: #fff; font-size: 12px; line-height: 16px; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateY(-50%); transition: opacity 0.15s;}
    .stage-tools:not(.is-attached) .tool-button::after {left: auto; right: calc(100% + 10px);}
    .tool-button:hover::after {opacity: 1;}
    /* 옵션 컨트롤 창: 프로토타입이 window.optionControl(전문관 목록 · 전환 함수)을 열어 두면 툴바 아래 8px에 그림 (위치는 script fitFrame)
       모바일에서는 이 창 대신 프로토타입 안(빅배너 위)에 가로 버튼이 뜸 (prototype/src/common/optioncontrol) */
    .option-panel {position: absolute; z-index: 1; width: 136px; padding: 4px; border-radius: 12px; background: #fff; box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 24px;}
    .option-panel[hidden] {display: none;}
    .option-panel-title {padding: 8px 12px 6px; font-size: 11px; font-weight: 600; line-height: 16px; letter-spacing: 0.08em; color: rgba(0, 0, 0, 0.45);}
    .option-panel-list {display: flex; flex-direction: column; gap: 2px;}
    .option-panel-button {display: block; width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: rgba(0, 0, 0, 0.7); font: inherit; font-size: 13px; font-weight: 500; line-height: 36px; text-align: left; cursor: pointer;}
    .option-panel-button:hover {background: rgba(0, 0, 0, 0.06);}
    .option-panel-button.is-active {background: #000; color: #fff; font-weight: 600;}
    .option-panel-check {display: flex; white-space: nowrap; align-items: center; gap: 8px; height: 40px; margin-bottom: 4px; padding: 0 12px; border-bottom: 1px solid rgba(0, 0, 0, 0.08); color: rgba(0, 0, 0, 0.8); font-size: 13px; font-weight: 500; cursor: pointer;}
    .option-panel-check[hidden] {display: none;}
    .option-panel-check input {width: 14px; height: 14px; margin: 0; accent-color: #000; cursor: pointer;}
    .stage-frame {position: absolute; top: 50%; left: 50%; width: var(--frame-w); height: var(--frame-h); border: 0; background: transparent; transform: translate(-50%, -50%) scale(var(--frame-scale, 1));}
  </style>
</head>
<body>

  <div class="layout">
    <aside class="panel">
      <div class="panel-head">
        <p class="panel-title" data-config="title"></p>
        <p class="panel-sub" data-config="sub"></p>
        <div class="panel-links">
          <a class="panel-link is-disabled" id="figmaLink" target="_blank" rel="noopener">
            <svg width="10" height="15" viewBox="0 0 38 57" aria-hidden="true"><path fill="#1abcfe" d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z"/><path fill="#0acf83" d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z"/><path fill="#ff7262" d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z"/><path fill="#f24e1e" d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z"/><path fill="#a259ff" d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z"/></svg>
            <span>Figma</span>
            <span class="panel-link-arrow">↗</span>
          </a>
          <a class="panel-link is-disabled" id="jiraLink" target="_blank" rel="noopener">
            <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path fill="#2684ff" d="M11.53 2c0 2.4 1.97 4.35 4.35 4.35h1.78v1.7c0 2.4 1.94 4.34 4.34 4.35V2.84a.84.84 0 0 0-.84-.84H11.53z"/><path fill="#2684ff" opacity=".8" d="M6.77 6.8a4.36 4.36 0 0 0 4.34 4.34h1.8v1.72a4.36 4.36 0 0 0 4.34 4.34V7.63a.84.84 0 0 0-.83-.83H6.77z"/><path fill="#2684ff" opacity=".65" d="M2 11.6c0 2.4 1.95 4.34 4.35 4.34h1.78v1.72c.01 2.39 1.95 4.33 4.34 4.34v-9.57a.84.84 0 0 0-.84-.84H2z"/></svg>
            <span>Jira</span>
            <span class="panel-link-arrow">↗</span>
          </a>
        </div>
      </div>
      <!-- 다운로드: TYPES 제목 위
           md: 인터랙션 명세 (CONFIG.spec, 비우면 숨김) / zip: download/ 폴더 (최종 결정된 프로토타입만, 비우면 숨김) -->
      <div class="panel-download-wrap">
        <a class="panel-download panel-download--sub is-hidden" id="specLink" download>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
          <span>Interaction (.md)</span>
        </a>
        <a class="panel-download is-hidden" id="downloadLink" download>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
          <span>Download (.zip)</span>
        </a>
      </div>
      <!-- 타입 목록·키보드 안내: 타입이 2개 이상일 때만 보임 (script) -->
      <p class="panel-label" id="typeLabel" data-config="label"></p>
      <ul class="type-list" id="typeList"></ul>
      <div class="panel-foot" id="panelFoot">
        <p class="panel-hint" id="keyHint"></p>
      </div>
    </aside>
    <main class="stage" id="stage">
      <div class="qr-card" id="qrCard">
        <a class="qr-image" id="qrImage" target="_blank" rel="noopener" title="새 창으로 열기"></a>
        <p class="qr-title" id="qrTitle"></p>
        <p class="qr-url" id="qrUrl"></p>
      </div>
      <div class="stage-tools" id="stageTools">
        <button class="tool-button" type="button" id="replayButton" data-tip="다시 재생 (R)" aria-label="다시 재생"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="tool-button" type="button" id="openButton" data-tip="새 창으로 보기" aria-label="새 창으로 보기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></button>
        <button class="tool-button" type="button" id="qrButton" data-tip="QR 코드" aria-label="QR 코드" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M21 21h-4v-4"/></svg></button>
      </div>
      <div class="option-panel" id="optionPanel" role="group" aria-label="스토어 선택" hidden>
        <!-- 체크인 아이콘 켜기 · 끄기 (프로토타입 optionControl.hasCheckin일 때만 보임). 창 맨 위 -->
        <label class="option-panel-check" id="optionCheckin" hidden><input type="checkbox" checked>이벤트 아이콘</label>
        <p class="option-panel-title">스토어</p>
        <div class="option-panel-list" id="optionList"></div>
      </div>
      <iframe class="stage-frame" id="frame" title="프로토타입"></iframe>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    // ================================================================================================= //
    /* 프로젝트 설정
        title·sub: 패널·브라우저 탭 제목 / label: 목록 위 작은 제목
        version: prototype(s)/*.html의 ?v= 값과 같게 올리기 (iframe 캐시 방지)
        items: 항목 추가는 한 줄 (id는 주소 #id로 쓰임)
        figma: 프로젝트 공통 피그마 설명 링크 / 항목별로 다르면 items의 figma에 적기 (항목 값이 우선, 둘 다 없으면 버튼 비활성)
        jira: 프로젝트 공통 Jira 링크 / 항목별로 다르면 items의 jira에 적기 (항목 값이 우선, 둘 다 없으면 버튼 비활성)
        spec: 인터랙션 명세 md (Type_N.html 옆 interaction.md를 그대로 연결, 복사본 만들지 않음). 비우면 버튼 숨김
        download: 내려받을 zip. 최종 결정된 프로토타입만 마지막에 넣음 (비우면 버튼 숨김)
                  download/ 폴더에 prototype(s) 폴더를 통째로 압축. 항목별로 다르면 items의 download
                  zip을 넣은 뒤 prototype(s) 안 파일을 고치면 zip도 다시 만들고 version 올리기
        items가 1개면 타입 목록·TYPES 제목·키보드 안내를 숨김 (showTypes: true면 1개여도 목록·제목은 보임, 키보드 안내는 2개부터)
        store: 항목을 같은 화면(file)의 전문관으로 띄울 때 .phone의 data-store 값 (주소 ?store=로 넘김)
    */
    var CONFIG = {
      title: '[앱바] 앱테크 진입점 모션',
      sub: '26-1111 · Prototype',
      label: 'TYPES',
      version: '20261111-27',
      qrHost: '192.168.0.79', // localhost에서 QR을 쓸 때만 내 PC 내부 IP 입력
      // figma: 'https://www.figma.com/design/C0XR68hLZmVbjQEOOqKCd0/%EC%9E%91%EC%97%85-26-11?node-id=55-2', // 확정 전이라 보관 (확정되면 주석 해제)
      figma: 'https://www.figma.com/design/o0jTKUbX15ampUa9e8VUEP/MDS-2.0-%EB%B3%80%EA%B2%BD-%EB%A1%9C%EA%B7%B8-%EA%B3%B5%EC%9C%A0?node-id=9373-12156&t=Xd5vaxGnlqC6HeJw-4',
      jira: 'https://jira.team.musinsa.com/browse/PD-10142',
      spec: 'prototype/interaction.md', // 인터랙션 명세 (보여줄 때만)
      download: 'download/prototype.zip', // prototype 폴더 압축 (prototype 안 파일을 고치면 다시 압축)
      showTypes: false, // 2nd는 Type 1 하나라 TYPES 목록 숨김 (타입이 늘면 true)
      /* 전문관 전환은 프로토타입 안(빅배너 위 옵션 컨트롤, optioncontrol.js)에서 함 → items는 타입 순서
         예전 방식(인덱스 왼쪽 목록에서 전문관 고르기)은 store 값으로 같은 화면을 여러 항목으로 띄웠음:
         { id: 'beauty', title: '뷰티', file: 'prototype/Type_1.html', store: 'beauty' } */
      items: [
        { id: 'type1', title: '앱테크 아이콘 모션', file: 'prototype/Type_1.html' }
        /* 2nd는 Type 1만 진행 (Type 2 · 3은 1st에 있음) */
      ]
    };
    // ================================================================================================= //
    
    (function () {
      var TYPES = CONFIG.items;
      var frame = document.getElementById('frame');
      var stage = document.getElementById('stage');
      var typeList = document.getElementById('typeList');
      var qrCard = document.getElementById('qrCard');
      var qrButton = document.getElementById('qrButton');
      var current = null;

      /* 설정 텍스트 채우기 */
      [].forEach.call(document.querySelectorAll('[data-config]'), function (el) {
        el.textContent = CONFIG[el.dataset.config];
      });
      document.title = CONFIG.title;
      document.getElementById('keyHint').textContent = '키보드 ↑ ↓ 로 전환 · R 다시 재생';
      /* 타입이 1개면 목록·TYPES 제목·키보드 안내 숨김 (전환할 게 없으므로). showTypes면 목록·제목은 1개여도 보임 */
      var multiType = TYPES.length > 1;
      var showList = multiType || !!CONFIG.showTypes;
      document.getElementById('typeLabel').hidden = !showList;
      document.getElementById('typeList').hidden = !showList;
      document.getElementById('panelFoot').hidden = !multiType;

      function fileUrl(type) {
        return type.file + '?v=' + CONFIG.version + (type.store ? '&store=' + type.store : '');
      }

      function findType(id) {
        return TYPES.filter(function (t) { return t.id === id; })[0] || TYPES[0];
      }

      /* iframe 이동: src를 바꾸면 방문 기록이 쌓여 뒤로가기가 iframe만 되돌리므로, 첫 로드 이후엔 replace */
      function loadFrame(url) {
        if (frame.getAttribute('src')) frame.contentWindow.location.replace(url);
        else frame.src = url;
      }

      /* QR 주소 규칙: GitHub Pages·IP 주소면 지금 주소 그대로, localhost면 호스트만 qrHost로 바꿈 */
      function shareUrl(type) {
        var url = new URL(fileUrl(type), location.href);
        if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(url.hostname)) {
          if (!CONFIG.qrHost) return null;
          url.hostname = CONFIG.qrHost;
        }
        return url;
      }

      /* 선택한 항목이 바뀔 때마다 QR 다시 그림 */
      function renderQr(type) {
        var url = shareUrl(type);
        var image = document.getElementById('qrImage');
        document.getElementById('qrTitle').textContent = type.title;
        if (!url) {
          image.innerHTML = '<p class="qr-empty">localhost에서는 CONFIG.qrHost에 내부 IP를 넣거나 IP 주소로 접속하세요</p>';
          image.removeAttribute('href');
          document.getElementById('qrUrl').textContent = '';
          return;
        }
        var qr = qrcode(0, 'M');
        qr.addData(url.href);
        qr.make();
        image.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
        image.href = url.href; /* QR을 누르면 QR과 같은 주소를 새 창으로 */
        document.getElementById('qrUrl').textContent = url.host + url.pathname;
      }

      /* 피그마 링크: 항목 figma → 공통 CONFIG.figma 순서, 없으면 비활성 */
      function renderFigma(type) {
        var link = document.getElementById('figmaLink');
        var url = type.figma || CONFIG.figma;
        if (url) link.href = url;
        else link.removeAttribute('href');
        link.classList.toggle('is-disabled', !url);
        link.title = url ? type.title + ' 피그마 설명 열기' : '피그마 링크가 아직 없습니다 (CONFIG.figma)';
      }

      /* Jira 링크: 항목 jira → 공통 CONFIG.jira 순서, 없으면 비활성 */
      function renderJira(type) {
        var link = document.getElementById('jiraLink');
        var url = type.jira || CONFIG.jira;
        if (url) link.href = url;
        else link.removeAttribute('href');
        link.classList.toggle('is-disabled', !url);
        link.title = url ? type.title + ' Jira 열기' : 'Jira 링크가 아직 없습니다 (CONFIG.jira)';
      }

      /* 다운로드 버튼(md·zip): 항목 값 → 공통 CONFIG 값 순서, 없으면 숨김. 받는 파일 이름은 원래 이름 그대로 */
      function renderDownload(type) {
        renderFile(document.getElementById('specLink'), type.spec || CONFIG.spec);
        renderFile(document.getElementById('downloadLink'), type.download || CONFIG.download);
      }
      function renderFile(link, file) {
        if (file) {
          link.href = file + '?v=' + CONFIG.version;
          link.setAttribute('download', file.split('/').pop());
        } else link.removeAttribute('href');
        link.classList.toggle('is-hidden', !file);
        link.title = file ? file.split('/').pop() + ' 내려받기' : '';
      }

      /* 같은 화면의 전문관만 바뀌면 다시 불러오지 않고 프로토타입의 setStore로 바꿈 (전환 중 깜빡임 없음) */
      function showType(next, prev) {
        var win = frame.getAttribute('src') && frame.contentWindow;
        if (prev && next.store && prev.file === next.file && win && win.setStore) {
          win.setStore(next.store);
          return;
        }
        loadFrame(fileUrl(next));
      }

      function select(id) {
        var prev = current;
        current = findType(id);
        showType(current, prev);
        renderQr(current);
        renderFigma(current);
        renderJira(current);
        renderDownload(current);
        document.title = CONFIG.title + ' · ' + current.title;
        [].forEach.call(typeList.querySelectorAll('.type-button'), function (button) {
          button.classList.toggle('is-active', button.dataset.id === current.id);
        });
        if (location.hash !== '#' + current.id) history.replaceState(null, '', '#' + current.id);
      }

      /* PC 패널 버튼 */
      TYPES.forEach(function (type) {
        var li = document.createElement('li');
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'type-button';
        button.textContent = type.title;
        button.dataset.id = type.id;
        button.addEventListener('click', function () {
          if (current && current.id === type.id) return;
          history.pushState(null, '', '#' + type.id);
          select(type.id);
        });
        li.appendChild(button);
        typeList.appendChild(li);
      });

      function replay() {
        loadFrame(fileUrl(current) + '&t=' + Date.now()); /* 다시 불러와 등장 모션부터 재생 */
      }
      document.getElementById('replayButton').addEventListener('click', replay);
      document.getElementById('openButton').addEventListener('click', function () {
        window.open(fileUrl(current), '_blank');
      });
      /* 접힌 QR: 툴바 버튼으로 열고 닫기, 바깥을 누르면 닫힘 */
      qrButton.addEventListener('click', function () {
        qrCard.classList.toggle('is-open');
        placeQrPopover();
      });
      document.addEventListener('click', function (e) {
        if (!qrCard.classList.contains('is-open') || qrCard.contains(e.target) || qrButton.contains(e.target)) return;
        qrCard.classList.remove('is-open');
        placeQrPopover();
      });

      /* 키보드: ↑ ↓ 로 타입 전환, R 다시 재생 (Cmd·Ctrl+R 새로고침은 그대로)
         폰(iframe)을 눌러 포커스가 안으로 들어가도 동작하도록 iframe 문서에도 같은 함수를 붙임 (아래 load)
         프로토타입 안 입력창에서 글자를 칠 때는 무시 */
      function onKey(e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
        if (e.key === 'r' || e.key === 'R') { replay(); return; }
        var index = TYPES.indexOf(current);
        var next = null;
        if (e.key === 'ArrowDown') next = TYPES[(index + 1) % TYPES.length];
        else if (e.key === 'ArrowUp') next = TYPES[(index - 1 + TYPES.length) % TYPES.length];
        if (!next || next === current) return;
        e.preventDefault();
        history.pushState(null, '', '#' + next.id);
        select(next.id);
      }
      document.addEventListener('keydown', onKey);

      /* 화면이 프레임보다 작으면 비율 유지하며 축소 */
      function fitFrame() {
        var style = getComputedStyle(document.documentElement);
        var pad = parseFloat(style.getPropertyValue('--frame-pad'));
        var frameW = parseFloat(style.getPropertyValue('--phone-w')) + pad * 2; /* CSS --frame-w와 같은 식 */
        var frameH = parseFloat(style.getPropertyValue('--phone-h')) + pad * 2;
        var scale = Math.min(1, stage.clientWidth / frameW, stage.clientHeight / frameH);
        frame.style.setProperty('--frame-scale', scale);

        /* QR 카드 단계: 폰 왼쪽 여백(바탕 왼쪽 24 + 폰과 간격 16 제외)에 맞춰 전체 → 작은 카드 → 툴바 버튼
           (프레임 안 그림자 여백 --frame-pad 제외한 실제 폰 왼쪽 기준) */
        var phoneLeft = (stage.clientWidth - frameW * scale) / 2 + pad * scale;
        var qrRoom = phoneLeft - 24 - 16;
        var folded = qrRoom < parseFloat(style.getPropertyValue('--qr-mini-w'));
        qrCard.classList.toggle('is-mini', !folded && qrRoom < parseFloat(style.getPropertyValue('--qr-card-w')));
        qrCard.classList.toggle('is-folded', folded);
        qrButton.hidden = !folded;
        if (!folded) qrCard.classList.remove('is-open');

        /* 툴바를 폰 오른쪽 12px·폰 윗선에 붙임. 오른쪽 여백(16px 포함)이 모자라면 바탕 우상단 */
        var tools = document.getElementById('stageTools');
        var phoneRight = stage.clientWidth - phoneLeft;
        var phoneTop = (stage.clientHeight - frameH * scale) / 2 + pad * scale;
        var attached = phoneRight + 12 + tools.offsetWidth + 16 <= stage.clientWidth;
        tools.classList.toggle('is-attached', attached);
        tools.style.left = attached ? phoneRight + 12 + 'px' : '';
        tools.style.top = attached ? phoneTop + 'px' : '';
        placeQrPopover();
        placeOptionPanel();
      }

      /* 옵션 컨트롤 창: 툴바 아래 8px, 툴바 왼쪽 끝에 맞춤 (툴바가 우상단으로 갔을 땐 오른쪽 끝에 맞춤) */
      function placeOptionPanel() {
        var panel = document.getElementById('optionPanel');
        var tools = document.getElementById('stageTools');
        if (panel.hidden) return;
        var attached = tools.classList.contains('is-attached');
        panel.style.left = (attached ? tools.offsetLeft : tools.offsetLeft + tools.offsetWidth - panel.offsetWidth) + 'px';
        panel.style.top = tools.offsetTop + tools.offsetHeight + 8 + 'px';
      }

      /* 프로토타입이 window.optionControl을 열어 두면 버튼을 만들고, 프로토타입의 'storechange'로 선택 표시를 맞춤 */
      function buildOptionPanel(win) {
        var panel = document.getElementById('optionPanel');
        var list = document.getElementById('optionList');
        var control = win && win.optionControl;
        list.innerHTML = '';
        panel.hidden = !control;
        if (!control) return;
        var phone = win.document.querySelector('.phone');
        var buttons = control.stores.map(function (store) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'option-panel-button';
          button.textContent = store.label;
          button.addEventListener('click', function () { control.select(store.id); });
          list.appendChild(button);
          return { id: store.id, el: button };
        });
        function update() {
          buttons.forEach(function (b) {
            var active = phone && phone.dataset.store === b.id;
            b.el.classList.toggle('is-active', active);
            b.el.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
        }
        win.addEventListener('storechange', update);
        update();

        /* '이벤트 아이콘' 체크박스: 프로토타입에 체크인 켜기 · 끄기가 있을 때만 (type_1.js setCheckin) */
        var check = document.getElementById('optionCheckin');
        var input = check.querySelector('input');
        check.hidden = !(control.hasCheckin && control.hasCheckin());
        if (!check.hidden) {
          input.checked = control.isCheckinOn();
          input.onchange = function () { control.setCheckin(input.checked); };
          win.addEventListener('checkinchange', function (event) { input.checked = event.detail; });
        }
        placeOptionPanel();
      }

      /* 접힌 QR 팝오버: 툴바 아래 8px, 툴바 오른쪽 끝에 맞춤 (폰 위에 겹쳐 뜸) */
      function placeQrPopover() {
        var open = qrCard.classList.contains('is-open');
        var tools = document.getElementById('stageTools');
        qrCard.style.left = open ? tools.offsetLeft + tools.offsetWidth - qrCard.offsetWidth + 'px' : '';
        qrCard.style.top = open ? tools.offsetTop + tools.offsetHeight + 8 + 'px' : '';
      }
      /* 바탕(폰 바깥)에서 굴린 세로 휠을 iframe 안 프로토타입 스크롤로 넘김 (pageScroll: prototype(s)/src/common/common.js) */
      stage.addEventListener('wheel', function (e) {
        var win = frame.contentWindow;
        if (!e.deltaY || !win || !win.pageScroll) return;
        e.preventDefault();
        win.pageScroll.scrollByWheel(e);
      }, { passive: false });

      /* 프로토타입을 불러올 때마다 그 폰 크기(common.css --phone-w·--phone-h)를 index에 옮김 → --frame-w·--frame-h는 calc로 따라감 */
      frame.addEventListener('load', function () {
        var doc = frame.contentDocument;
        if (!doc) return;
        doc.addEventListener('keydown', onKey); /* 폰 안에 포커스가 있어도 단축키 동작 */
        buildOptionPanel(frame.contentWindow); /* 전문관 전환 창 (프로토타입에 optionControl이 있을 때만) */
        var phone = getComputedStyle(doc.documentElement);
        var w = parseFloat(phone.getPropertyValue('--phone-w'));
        var h = parseFloat(phone.getPropertyValue('--phone-h'));
        if (!w || !h) return;
        document.documentElement.style.setProperty('--phone-w', w + 'px');
        document.documentElement.style.setProperty('--phone-h', h + 'px');
        fitFrame();
      });
      new ResizeObserver(fitFrame).observe(stage); /* 창 크기·레이아웃이 바뀌면 축소·QR 단계·툴바 위치 다시 계산 */
      window.addEventListener('popstate', function () { select(location.hash.slice(1)); });

      fitFrame();
      select(location.hash.slice(1));
    })();
  </script>

</body>
</html>
